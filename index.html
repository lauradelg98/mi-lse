<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi LSE</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,system-ui,sans-serif;background:linear-gradient(135deg,#eef4ef,#fbf1df);color:#18312b}.app{max-width:900px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0}.tools{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin:18px 0}input,select,button{font:inherit}input,select,.mix{padding:12px;border:1px solid #d8ded9;border-radius:13px;background:white}.searchbox{position:relative}.clearSearch{display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:12;width:30px;height:30px;border:0;border-radius:50%;background:#eef1ee;color:#40504b;font-size:18px;line-height:1;cursor:pointer}.clearSearch.show{display:block}.searchbox input{padding-right:46px}input{width:100%}.suggestions{display:none;position:absolute;z-index:10;top:52px;left:0;right:0;background:white;border:1px solid #d8ded9;border-radius:14px;box-shadow:0 15px 35px #0002;max-height:300px;overflow:auto}.suggestions.show{display:block}.suggestion{display:block;width:100%;text-align:left;padding:12px;border:0;border-bottom:1px solid #eee;background:white;cursor:pointer}.suggestion:hover{background:#eef6f1}.card{background:#fffdf8;border-radius:24px;padding:18px;box-shadow:0 18px 50px #27493b22;text-align:center;min-height:540px}.topline{display:flex;justify-content:space-between;color:#63736e}.bar{height:6px;background:#e3e8e4;border-radius:9px;margin:12px 0 24px;overflow:hidden}.bar i{display:block;height:100%;background:#397660}.prompt{text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:#397660}.word{font-size:52px;font-weight:800;margin:18px 0}video{width:min(100%,520px);max-height:330px;background:#10231e;border-radius:20px}.answer{margin:18px;background:#285f50;color:white;border:0;border-radius:15px;padding:13px 22px;font-weight:700}.rating{display:flex;gap:10px;justify-content:center;margin-top:16px}.rating button{border:0;border-radius:13px;padding:11px 18px;font-weight:700}.again{background:#f8d9d6}.hard{background:#fde7bd}.easy{background:#d7eadf}.hidden{display:none!important}.definition{max-width:650px;margin:10px auto;color:#53625e}@media(max-width:620px){.tools{grid-template-columns:1fr 1fr}.searchbox{grid-column:1/-1}.word{font-size:40px}}
.home{min-height:90vh;display:grid;place-items:center;padding:24px}.homebox{width:min(680px,100%);text-align:center}.homebox h1{font-size:clamp(2.6rem,8vw,4.6rem);margin:0}.homebox p{color:#65756f;margin:8px 0 30px}.homeActions{display:grid;grid-template-columns:1fr 1fr;gap:18px}.homeBtn{border:0;border-radius:24px;padding:30px 20px;cursor:pointer;font-weight:800;font-size:1.25rem;box-shadow:0 14px 38px #234b3e22}.homeBtn small{display:block;font-weight:500;font-size:.9rem;margin-top:7px}.reviewBtn{background:#285f50;color:#fff}.searchBtn{background:#fff;color:#285f50;border:1px solid #d8ded9}.backHome{border:0;background:#eef1ee;color:#294d42;border-radius:12px;padding:9px 13px;cursor:pointer;margin-bottom:12px}@media(max-width:620px){.homeActions{grid-template-columns:1fr}}.favList{display:none;background:#fffdf8;border-radius:24px;padding:18px;box-shadow:0 18px 50px #27493b22}.favList.show{display:block}.favList h2{margin-top:0}.favItem{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;border-bottom:1px solid #e8ece8;background:transparent;padding:14px 4px;text-align:left;cursor:pointer}.favItem:last-child{border-bottom:0}.favItem b{font-size:1.05rem}.favEmpty{color:#687773;padding:24px 4px;text-align:center}</style></head><body><section id="home" class="home"><div class="homebox"><h1>🤟 Mi LSE</h1><p>¿Qué quieres hacer?</p><div class="homeActions"><button id="goReview" class="homeBtn reviewBtn">🔁 Repaso<small>Practicar tus fichas</small></button><button id="goSearch" class="homeBtn searchBtn">🔎 Buscador<small>Consultar un signo directamente</small></button><button id="goFavorites" class="homeBtn searchBtn">⭐ Favoritas<small>Ver tus signos guardados</small></button></div></div></section><main id="mainApp" class="app hidden"><button id="backHome" class="backHome">← Inicio</button><header><div><h1>🤟 Mi LSE</h1><small>Fichas privadas con vídeo en streaming</small></div><div id="stats">0 aprendidas · 0 ★</div></header><div class="tools"><div class="searchbox"><input id="search" placeholder="Buscar palabra…" autocomplete="off"><button id="clearSearch" class="clearSearch" type="button" aria-label="Borrar búsqueda">×</button><div id="suggestions" class="suggestions"></div></div><select id="mode" class="studyOnly"><option value="video">LSE → español</option><option value="word">Español → LSE</option></select><button class="mix studyOnly" id="mix">🔀 Mezclar</button></div><section class="card"><div class="topline"><span id="count" class="studyOnly"></span><button id="fav" style="border:0;background:none;font-size:22px">☆</button></div><div class="bar studyOnly"><i id="bar"></i></div><div id="prompt" class="prompt"></div><div id="word" class="word"></div><video id="video" controls playsinline preload="metadata"></video><div><button id="answer" class="answer">Mostrar respuesta</button></div><div id="definition" class="definition hidden"></div><div id="rating" class="rating hidden studyOnly"><button class="again" data-g="again">Otra vez</button><button class="hard" data-g="hard">Difícil</button><button class="easy" data-g="easy">Fácil</button></div></section><section id="favList" class="favList"><h2>⭐ Favoritas</h2><div id="favItems"></div></section></main><script>
const cards=[{"word": "A Coruña", "entry": "A Coruña", "definition": "Capital de la provincia que lleva el mismo nombre. Provincia de la comunidad autónoma de Galicia. Ciudad española situada en el noroeste de España.", "video": "https://panel.fundacioncnse-dilse.org/storage/a_coruna.mov"}, {"word": "abajo", "entry": "abajo", "definition": "En un lugar que está más bajo o en la parte baja. En una situación social o jerárquica más baja.", "video": "https://panel.fundacioncnse-dilse.org/storage/abajo.mov"}, {"word": "abogado/a", "entry": "abogado, da", "definition": "Profesional del derecho que ofrece asesoramiento jurídico y ejerce la defensa en procesos judiciales o administrativos.", "video": "https://panel.fundacioncnse-dilse.org/storage/abogado.mov"}, {"word": "abril", "entry": "abril", "definition": "Cuarto mes del año, que tiene 30 días.", "video": "https://panel.fundacioncnse-dilse.org/storage/abril.mov"}, {"word": "abuelo/a", "entry": "abuelo, la", "definition": "Padre o madre de uno de los padres de una persona.", "video": "https://panel.fundacioncnse-dilse.org/storage/abuelo.mov"}, {"word": "aburrido/a", "entry": "aburrido, da", "definition": "Que causa aburrimiento.", "video": "https://panel.fundacioncnse-dilse.org/storage/aburrido.mov"}, {"word": "ascensor", "entry": "ascensor", "definition": "Aparato para trasladar personas de unos pisos a otros.", "video": "https://panel.fundacioncnse-dilse.org/storage/ascensor.mov"}, {"word": "adiós", "entry": "adiós", "definition": "Fórmula usada para despedirse.", "video": "https://panel.fundacioncnse-dilse.org/storage/adios_5.mov"}, {"word": "adiós", "entry": "adiós (variante 2)", "definition": "Otra variante del signo usado para despedirse.", "video": "https://panel.fundacioncnse-dilse.org/storage/adios_A.mov"}, {"word": "agosto", "entry": "agosto", "definition": "Octavo mes del año, que tiene 31 días.", "video": "https://panel.fundacioncnse-dilse.org/storage/agosto.mov"}, {"word": "agua", "entry": "agua", "definition": "Sustancia líquida sin olor ni sabor en estado puro, esencial para los seres vivos.", "video": "https://panel.fundacioncnse-dilse.org/storage/agua.mov"}, {"word": "ahí", "entry": "ahí", "definition": "En ese lugar, a ese lugar o en ese punto.", "video": "https://panel.fundacioncnse-dilse.org/storage/ahi.mov"}, {"word": "ahora", "entry": "ahora", "definition": "En este momento o en el tiempo actual.", "video": "https://panel.fundacioncnse-dilse.org/storage/ahora.mov"}];let list=[...cards],idx=0,revealed=false;let state={};try{state=JSON.parse(localStorage.getItem('miLSEState')||'{}')}catch(e){}
const $=x=>document.getElementById(x);const norm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim(); const key=c=>c.word+'|'+c.video;
function save(){try{localStorage.setItem('miLSEState',JSON.stringify(state))}catch(e){};stats()}function stats(){let v=Object.values(state);$('stats').textContent=v.filter(x=>x.fav).length+' ★'}
function render(){let c=list[idx];if(!c)return;$('count').textContent=(idx+1)+' de '+list.length;$('bar').style.width=((idx+1)/list.length*100)+'%';$('fav').textContent=(state[key(c)]||{}).fav?'★':'☆';revealed=false;$('definition').classList.add('hidden');$('rating').classList.add('hidden');$('answer').classList.remove('hidden');$('video').pause();$('video').src=c.video;$('video').load();let m=$('mode').value;if(m==='video'){$('prompt').textContent='¿Qué significa este signo?';$('word').textContent='?';$('video').classList.remove('hidden');$('video').autoplay=true;$('video').muted=true;$('video').play().catch(()=>{})}else{$('prompt').textContent='¿Cómo se signa?';$('word').textContent=c.word;$('video').classList.add('hidden')}}
function reveal(){let c=list[idx];revealed=true;$('word').textContent=c.word;$('video').classList.remove('hidden');$('definition').textContent=c.definition;$('definition').classList.remove('hidden');if(!$('rating').classList.contains('studyOnly') || !document.querySelector('.studyOnly.hidden')){$('rating').classList.remove('hidden')}else{$('rating').classList.add('hidden')}$('answer').classList.add('hidden');$('video').play().catch(()=>{})}
function suggestions(q){let n=norm(q),box=$('suggestions');if(!n){box.classList.remove('show');box.innerHTML='';return}let matches=cards.filter(c=>norm(c.word+' '+c.entry+' '+c.definition).includes(n));let seen=new Set();matches=matches.filter(c=>{let k=c.word+'|'+c.entry;if(seen.has(k))return false;seen.add(k);return true}).slice(0,15);box.innerHTML=matches.map(c=>'<button class="suggestion" data-v="'+c.video+'"><b>'+c.word+'</b>'+(c.entry!==c.word?' · '+c.entry:'')+'</button>').join('');box.classList.toggle('show',matches.length>0)}
$('search').addEventListener('input',e=>{$('clearSearch').classList.toggle('show',e.target.value.length>0);suggestions(e.target.value)});$('clearSearch').addEventListener('click',()=>{$('search').value='';$('clearSearch').classList.remove('show');$('suggestions').classList.remove('show');list=[...cards];idx=0;document.querySelector('.card').classList.add('hidden');$('search').focus()});$('suggestions').addEventListener('click',e=>{let b=e.target.closest('.suggestion');if(!b)return;let c=cards.find(x=>x.video===b.dataset.v);$('search').value=c.word;list=cards.filter(x=>x.word===c.word);idx=Math.max(0,list.findIndex(x=>x.video===c.video));$('suggestions').classList.remove('show');document.querySelector('.card').classList.remove('hidden');render();reveal();});$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){let n=norm(e.target.value),m=cards.filter(c=>norm(c.word+' '+c.entry+' '+c.definition).includes(n));if(m.length){list=m;idx=0;$('suggestions').classList.remove('show');document.querySelector('.card').classList.remove('hidden');render();reveal()}}});document.addEventListener('click',e=>{if(!e.target.closest('.searchbox'))$('suggestions').classList.remove('show')});$('answer').onclick=reveal;$('mode').onchange=render;$('mix').onclick=()=>{list.sort(()=>Math.random()-.5);idx=0;render()};$('fav').onclick=()=>{let c=list[idx],k=key(c);state[k]={...(state[k]||{}),fav:!(state[k]||{}).fav};save();render()};$('rating').onclick=e=>{if(!e.target.dataset.g)return;let c=list[idx];state[key(c)]={...(state[key(c)]||{}),grade:e.target.dataset.g};save();idx=(idx+1)%list.length;render()};function renderFavorites(){
 const favs=cards.filter(c=>(state[key(c)]||{}).fav); const box=$('favItems');
 box.innerHTML=favs.length?favs.map(c=>'<button class="favItem" data-v="'+c.video+'"><span><b>'+c.word+'</b><br><small>'+c.entry+'</small></span><span>›</span></button>').join(''):'<div class="favEmpty">Todavía no has añadido ninguna palabra a favoritas.</div>';
}
function openFavorites(){
 $('home').classList.add('hidden');$('mainApp').classList.remove('hidden');document.querySelector('.tools').classList.add('hidden');document.querySelector('.card').classList.add('hidden');$('favList').classList.add('show');renderFavorites();
}
$('favItems').onclick=e=>{const b=e.target.closest('.favItem');if(!b)return;const c=cards.find(x=>x.video===b.dataset.v);if(!c)return;$('favList').classList.remove('show');document.querySelector('.tools').classList.add('hidden');document.querySelector('.card').classList.remove('hidden');document.querySelectorAll('.studyOnly').forEach(x=>x.classList.add('hidden'));list=cards.filter(x=>x.word===c.word);idx=Math.max(0,list.findIndex(x=>x.video===c.video));render();reveal();};
$('goFavorites').onclick=openFavorites;
function openReview(){
 $('home').classList.add('hidden');$('mainApp').classList.remove('hidden');$('favList').classList.remove('show');document.querySelector('.tools').classList.remove('hidden');
 document.querySelectorAll('.studyOnly').forEach(x=>x.classList.remove('hidden'));
 $('search').value='';$('clearSearch').classList.remove('show');$('suggestions').classList.remove('show');
 list=[...cards];idx=0;document.querySelector('.card').classList.remove('hidden');render();
}
function openSearch(){
 $('home').classList.add('hidden');$('mainApp').classList.remove('hidden');$('favList').classList.remove('show');document.querySelector('.tools').classList.remove('hidden');
 document.querySelectorAll('.studyOnly').forEach(x=>x.classList.add('hidden'));
 document.querySelector('.card').classList.add('hidden');
 $('search').value='';$('clearSearch').classList.remove('show');$('suggestions').classList.remove('show');
 list=[...cards];idx=0;render();setTimeout(()=>$('search').focus(),80);
}
function goHome(){
 $('favList').classList.remove('show');document.querySelector('.tools').classList.remove('hidden');$('mainApp').classList.add('hidden');$('home').classList.remove('hidden');
 try{$('video').pause()}catch(e){}
}
$('goReview').onclick=openReview;$('goSearch').onclick=openSearch;$('backHome').onclick=goHome;
stats();
</script></body></html>
