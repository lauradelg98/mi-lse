nter}.count{color:#667771;text-align:left}.star{float:right;border:0;background:none;font-size:24px;cursor:pointer}.bar{height:6px;background:#e3e8e4;border-radius:9px;overflow:hidden;margin:12px 0 22px}.bar i{display:block;height:100%;background:#397660}.prompt{text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:#397660}.word{font-size:clamp(2.5rem,7vw,4.2rem);font-weight:800;margin:18px 0}.videoNav{display:flex;align-items:center;justify-content:center;gap:14px;max-width:680px;margin:auto}.videoNav video{width:min(100%,540px);max-height:340px;background:#10231e;border-radius:20px}.navCard{border:0;background:#285f50;color:#fff;width:54px;height:54px;min-width:54px;border-radius:16px;font-size:1.6rem;cursor:pointer}.navCard:disabled{visibility:hidden}.reviewNav{display:flex;justify-content:center;gap:22px;margin:18px 0 4px}.answer{margin:17px;border:0;border-radius:14px;background:#285f50;color:#fff;padding:13px 22px;font-weight:800}.definition{max-width:650px;margin:12px auto;color:#53625e;white-space:pre-line}.rating{margin-top:12px}.allWords{margin-top:18px}.allWordsHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.allWordsCount{color:#667771}.searchbox input{width:100%;padding:13px;border:1px solid #d8ded9;border-radius:13px;background:#fff}.allWordsGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}.wordTile{background:#fffdf8;border-radius:18px;padding:12px;box-shadow:0 8px 24px #27493b18;text-align:left;border:1px solid #e7ebe8;cursor:pointer}.wordTile img{width:100%;height:145px;object-fit:contain;border-radius:13px;background:#eef1ee;display:block}.wordTile b{display:block;font-size:1.05rem;margin-top:10px}.wordTile small{display:block;color:#667771;margin-top:4px}.favItem{display:flex;justify-content:space-between;width:100%;border:0;border-bottom:1px solid #e7ebe8;background:transparent;padding:14px;text-align:left;cursor:pointer}.catalogBack{border:0;background:#eef4ef;color:#285f50;border-radius:12px;padding:9px 12px;font-weight:700;cursor:pointer;margin-bottom:12px}@media(max-width:650px){.secondaryActions{grid-template-columns:1fr}.allWordsGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.wordTile{padding:8px}.wordTile img{height:110px}.videoNav{gap:0}.navCard{width:50px;height:46px;min-width:50px}}

<script>const cards=[{"word":"A Coruña","entry":"A Coruña","definition":"1. Capital de la provincia que lleva el mismo nombre.\n2. Provincia de la comunidad autónoma de Galicia.\n3. Ciudad española que está localizada en la parte noroeste de España.","video":"https://panel.fundacioncnse-dilse.org/storage/a_coruna.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/a_coruna.png"},{"word":"A veces","entry":"vez (#a la de veces, o a las de veces, o a las veces)","definition":"En alguna ocasión o tiempo, como excepción de lo que comúnmente sucede, o contraponiéndolo a otro tiempo u ocasión.","video":"https://panel.fundacioncnse-dilse.org/storage/veces_a.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/vez_de_en_cuando.png"},{"word":"A ver (extrañeza)","entry":"ver (#a ver)","definition":"Para pedir algo que se quiere reconocer o ver.","video":"https://panel.fundacioncnse-dilse.org/storage/ver_d.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/ver_d.png"},{"word":"Abajo","entry":"abajo","definition":"1. En un lugar que está más bajo o en la parte baja.\n2. En una situación social o jerárquica más baja.","video":"https://panel.fundacioncnse-dilse.org/storage/abajo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/abajo.png"},{"word":"Abierto/a (carácter)","entry":"abierto, ta","definition":"1. No murado, no cercado.\n2. Dicho de una persona: Franca, llana, receptiva.\n3. Dicho de una relación o de una lista: Susceptible de cambios.\n4. Poco acotado, restringido o preciso.","video":"https://panel.fundacioncnse-dilse.org/storage/abierto.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/abierto.png"},{"word":"Abogado/a","entry":"abogado, da","definition":"Licenciado en derecho que ofrece profesionalmente asesoramiento jurídico y que ejerce la defensa de las partes en los procesos judiciales o en los procedimientos administrativos.","video":"https://panel.fundacioncnse-dilse.org/storage/abogado.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/abogado.png"},{"word":"Abrazo","entry":"abrazo","definition":"1. Acción y efecto de abrazar (estrechar entre los brazos).\n2. Acción y efecto de abrazar (ceñir con los brazos).","video":"https://panel.fundacioncnse-dilse.org/storage/abrazo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/abrazo.png"},{"word":"Abril","entry":"abril","definition":"Cuarto mes del año, que tiene 30 días.","video":"https://panel.fundacioncnse-dilse.org/storage/abril.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/abril.png"},{"word":"Abuelo/a","entry":"abuelo, la","definition":"Padre o madre de uno de los padres de una persona.","video":"https://panel.fundacioncnse-dilse.org/storage/abuelo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/abuelo.png"},{"word":"Aburrido/a","entry":"aburrido, da","definition":"Que causa aburrimiento.","video":"https://panel.fundacioncnse-dilse.org/storage/aburrido.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/aburrido.png"},{"word":"Academia","entry":"academia","definition":"1. Sociedad científica, literaria o artística establecida con autoridad pública.\n2. Academias de Bellas Artes: instituciones artísticas creadas en los siglos XVIII y XIX para la sistematización de la enseñanza del arte. El arte academicista basa su estética en cánones heredados de la tradición clásica y de maestros consagrados. Las Academias desempeñaron un papel fundamental en la organización del sistema artístico oficial, monopolizando el gusto, la crítica, el mercado y la difusión del arte.","video":"https://panel.fundacioncnse-dilse.org/storage/academia.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/academia.png"},{"word":"Aceite","entry":"aceite","definition":"1. Líquido graso que se obtiene de frutos o semillas, como cacahuetes, algodón, soja, nueces, almendras, linaza, ricino o coco, y de algunos animales, como la ballena, la foca o el bacalao.\n2. Aceite obtenido de las aceitunas.\n3. Líquido denso de origen natural, como el petróleo, o que se obtiene por destilación de ciertos minerales bituminosos o de la hulla, el lignito y la turba.\n4. Sustancia grasa, líquida a temperatura ordinaria, de mayor o menor viscosidad, no miscible con agua y de menor densidad que ella, que se puede obtener sintéticamente.","video":"https://panel.fundacioncnse-dilse.org/storage/aceite.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/aceite.png"},{"word":"Acordar (ponerse de acuerdo)","entry":"acordar","definition":"Dicho de un conjunto de personas: Determinar o resolver algo de común acuerdo, o por mayoría de votos.","video":"https://panel.fundacioncnse-dilse.org/storage/acordar-acuerdo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/acordar-acuerdo.png"},{"word":"Adiós","entry":"adiós","definition":"1. Para despedirse.\n2. Despedida al término de una conversación, misiva, etc.","video":"https://panel.fundacioncnse-dilse.org/storage/adios_5.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/adios_5.png"},{"word":"Administrativo/a (persona)","entry":"administrativo, va","definition":"1. Perteneciente o relativo a la administración.\n2. Persona empleada en la administración de alguna entidad.","video":"https://panel.fundacioncnse-dilse.org/storage/administrativo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/administrativo.png"},{"word":"Aeropuerto","entry":"aeropuerto","definition":"Área destinada al aterrizaje y despegue de aviones dotada de instalaciones para el control del tráfico aéreo y de servicios a los pasajeros.","video":"https://panel.fundacioncnse-dilse.org/storage/aeropuerto.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/aeropuerto.png"},{"word":"Afición","entry":"afición","definition":"1. Inclinación o atracción que se siente hacia un objeto o una actividad que gustan.\n2. Actividad que se realiza habitualmente y por gusto en ratos de ocio.","video":"https://panel.fundacioncnse-dilse.org/storage/aficion.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/aficion.png"},{"word":"Agencia (de viajes)","entry":"agencia","definition":"Empresa destinada a gestionar asuntos ajenos o a prestar determinados servicios.","video":"https://panel.fundacioncnse-dilse.org/storage/agencia.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/agencia.png"},{"word":"Agosto","entry":"agosto","definition":"Octavo mes del año, que tiene 31 días.","video":"https://panel.fundacioncnse-dilse.org/storage/agosto.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/agosto.png"},{"word":"Agricultura","entry":"agricultura","definition":"1. Cultivo o labranza de la tierra.\n2. Conjunto de técnicas y conocimientos relativos al cultivo de la tierra.","video":"https://panel.fundacioncnse-dilse.org/storage/agricultura.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/agricultura.png"},{"word":"Agua","entry":"agua","definition":"Sustancia liquída que, en estado puro, no tiene olor ni sabor y que es el componente más abundante de la superficie terrestre y el esencial de los seres vivos.","video":"https://panel.fundacioncnse-dilse.org/storage/agua.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/agua.png"},{"word":"Ahora","entry":"ahora","definition":"1. En este momento o en el tiempo actual.\n2. Este momento o el tiempo actual.","video":"https://panel.fundacioncnse-dilse.org/storage/ahora.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/ahora.png"},{"word":"Ahí","entry":"ahí","definition":"1. En ese lugar.\n2. A ese lugar.\n3. Ese lugar\n4. En eso o en esto, en ese punto o en esa cuestión.","video":"https://panel.fundacioncnse-dilse.org/storage/ahi.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/ahi.png"},{"word":"Aire","entry":"aire","definition":"Mezcla gaseosa, constituida principalmente por oxígeno y nitrógeno, que forma la atmósfera terrestre y es imprescindible para respirar.","video":"https://panel.fundacioncnse-dilse.org/storage/aire.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/aire.png"},{"word":"Ajedrez","entry":"ajedrez","definition":"Juego que se practica sobre un tablero de cuadros alternativamente blancos y negros, entre dos jugadores con dieciséis piezas cada uno, de las cuales la más importante es el rey.","video":"https://panel.fundacioncnse-dilse.org/storage/ajedrez.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/ajedrez.png"},{"word":"Ajo","entry":"ajo","definition":"Planta con un bulbo redondo, de olor fuerte y sabor picante, muy usado como condimento.","video":"https://panel.fundacioncnse-dilse.org/storage/ajo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/ajo.png"},{"word":"Albacete","entry":"Albacete","definition":"1. Ciudad española que está localizada en la parte sureste de España.\n2. Provincia de la comunidad autónoma de Castilla- La Mancha\n3. Capital de la provincia que lleva el mismo nombre.","video":"https://panel.fundacioncnse-dilse.org/storage/albacete.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/albacete.png"},{"word":"Alegre/Alegrarse","entry":"alegre","definition":"1. Poseído o lleno de alegría.\n2. Que siente o manifiesta de ordinario alegría.\n3. Que denota alegría o viveza.\n4. Que ocasiona alegría.","video":"https://panel.fundacioncnse-dilse.org/storage/alegre.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/alegre.png"},{"word":"Alergia","entry":"alergia","definition":"Sensibilidad especial del organismo ante determinados agentes, que se manifiesta con alteraciones respiratorias, nerviosas o cutáneas.","video":"https://panel.fundacioncnse-dilse.org/storage/alergia.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/alergia.png"},{"word":"Alfombra","entry":"alfombra","definition":"Tejido de lana o de otras materias, y de varios dibujos y colores, con que se cubre el piso de las habitaciones y escaleras para abrigo y adorno.","video":"https://panel.fundacioncnse-dilse.org/storage/alfombra.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/alfombra.png"},{"word":"Algo","entry":"algo","definition":"Denota una cantidad pequeña e indeterminada de alguna magnitud.","video":"https://panel.fundacioncnse-dilse.org/storage/algo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/algo.png"},{"word":"Alicante","entry":"Alicante","definition":"1. Ciudad española que está localizada en la parte sureste de España.\n2. Provincia de la comunidad autónoma Comunidad Valenciana\n3. Capital de la provincia que lleva el mismo nombre.","video":"https://panel.fundacioncnse-dilse.org/storage/alicante.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/alicante.png"},{"word":"Alivio/Aliviar","entry":"alivio","definition":"Acción y efecto de aliviarse.","video":"https://panel.fundacioncnse-dilse.org/storage/alivio.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/alivio.png"},{"word":"Allí","entry":"allí","definition":"1. En aquel lugar.\n2. A aquel lugar.\n3. Aquel lugar.","video":"https://panel.fundacioncnse-dilse.org/storage/alli.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/alli.png"},{"word":"Almería","entry":"Almería","definition":"1. Ciudad española que está localizada en la parte sureste de España.\n2. Provincia de la comunidad autónoma de Andalucía.\n3. Capital de la provincia que lleva el mismo nombre.","video":"https://panel.fundacioncnse-dilse.org/storage/almeria.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/almeria.png"},{"word":"Alquiler/Alquilar","entry":"alquiler","definition":"Acción y efecto de alquilar.","video":"https://panel.fundacioncnse-dilse.org/storage/alquiler.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/alquiler.png"},{"word":"Alto/a (estatura)","entry":"alto, ta","definition":"De gran estatura.","video":"https://panel.fundacioncnse-dilse.org/storage/alto-estatura.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/alto-estatura.png"},{"word":"Alumno/a","entry":"alumno, na","definition":"Persona que recibe enseñanza, respecto de un profesor o de la escuela, colegio o universidad donde estudia.","video":"https://panel.fundacioncnse-dilse.org/storage/alumno.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/alumno.png"},{"word":"Amargo/a","entry":"amargo, ga","definition":"Dicho de un sabor: Fuerte y desagradable como el de la bilis o hiel.","video":"https://panel.fundacioncnse-dilse.org/storage/amargo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/amargo.png"},{"word":"Amarillo","entry":"amarillo, lla","definition":"1. Dicho de un color: Semejante al del oro o al de yema del huevo.\n2. De color amarillo.","video":"https://panel.fundacioncnse-dilse.org/storage/amarillo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/amarillo.png"},{"word":"Ambulancia","entry":"ambulancia","definition":"Vehículo destinado al transporte de heridos y enfermos, y de elementos de cura y auxilio.","video":"https://panel.fundacioncnse-dilse.org/storage/ambulancia.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/ambulancia.png"},{"word":"Amigo/a","entry":"amigo, ga","definition":"1. Que tiene relación de amistad.\n2. Amistoso (perteneciente a la amistad).","video":"https://panel.fundacioncnse-dilse.org/storage/amigo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/amigo.png"},{"word":"Amo/a de casa","entry":"amo, ma (#amo, ma de casa)","definition":"Persona que se ocupa de las tareas de su casa.","video":"https://panel.fundacioncnse-dilse.org/storage/amo_de_casa.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/amo_de_casa.png"},{"word":"Andalucía","entry":"Andalucía","definition":"Comunidad autónoma que está localizada en la parte sur de España, formada por ocho provincias y cuya capital es Sevilla.","video":"https://panel.fundacioncnse-dilse.org/storage/andalucia.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/andalucia.png"},{"word":"Andar","entry":"andar","definition":"Ir de un lugar a otro dando pasos.","video":"https://panel.fundacioncnse-dilse.org/storage/andar-caminar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/andar-caminar.png"},{"word":"Anillo (complemento)","entry":"anillo","definition":"Aro de metal u otra materia, liso o con labores, y con perlas o piedras preciosas o sin ellas, que se lleva, principalmente por adorno, en los dedos de la mano.","video":"https://panel.fundacioncnse-dilse.org/storage/anillo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/anillo.png"},{"word":"Animal","entry":"animal","definition":"Ser orgánico que vive, siente y se mueve por propio impulso.","video":"https://panel.fundacioncnse-dilse.org/storage/animal.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/animal.png"},{"word":"Antes","entry":"antes","definition":"Denota prioridad de tiempo.","video":"https://panel.fundacioncnse-dilse.org/storage/antes.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/antes.png"},{"word":"Antipático/a","entry":"antipático, ca","definition":"Que causa antipatía o rechazo, especialmente por falta de amabilidad.","video":"https://panel.fundacioncnse-dilse.org/storage/antipatico.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/antipatico.png"},{"word":"Aparcamiento","entry":"aparcamiento","definition":"1. Acción y efecto de aparcar un vehículo.\n2. Lugar o recinto destinado a aparcar vehículos.","video":"https://panel.fundacioncnse-dilse.org/storage/aparcamiento.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/aparcamiento.png"},{"word":"Apartamento","entry":"apartamento","definition":"Piso pequeño para vivir.","video":"https://panel.fundacioncnse-dilse.org/storage/apartamento.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/apartamento.png"},{"word":"Apellido","entry":"apellido","definition":"Nombre de familia con que se distinguen las personas; por ejemplo, Fernández, Guzmán.","video":"https://panel.fundacioncnse-dilse.org/storage/apellido.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/apellido.png"},{"word":"Aprender","entry":"aprender","definition":"1. Adquirir el conocimiento de algo por medio del estudio o de la experiencia.\n2. Fijar algo en la memoria.","video":"https://panel.fundacioncnse-dilse.org/storage/aprender.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/aprender.png"},{"word":"Aprobar (examen)","entry":"aprobar","definition":"Obtener la calificación de aprobado en una asignatura o examen.","video":"https://panel.fundacioncnse-dilse.org/storage/aprobar-ganar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/aprobar-ganar.png"},{"word":"Aquí","entry":"aquí","definition":"1. En este lugar.\n2. A este lugar.\n3. Este lugar.","video":"https://panel.fundacioncnse-dilse.org/storage/aqui.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/aqui.png"},{"word":"Aragón","entry":"Aragón","definition":"Comunidad autónoma que está localizada en la parte norte de España, formada por 3 provincias y cuya capital es Zaragoza.","video":"https://panel.fundacioncnse-dilse.org/storage/aragon.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/aragon.png"},{"word":"Araña","entry":"araña","definition":"Animal invertebrado con cuatro pares de patas y al abbomen abultado, que segrega un hilo viscoso con el que caza a sus presas y se traslada de un lugar a otro.","video":"https://panel.fundacioncnse-dilse.org/storage/arana.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/arana.png"},{"word":"Armario","entry":"armario","definition":"Mueble con puertas y estantes o perchas para guardar ropa y otros objetos.","video":"https://panel.fundacioncnse-dilse.org/storage/armario-mueble.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/armario-mueble.png"},{"word":"Arriba","entry":"arriba","definition":"En un lugar que está más alto o en la parte alta.","video":"https://panel.fundacioncnse-dilse.org/storage/arriba_b.mov","photo":"https://panel.f ulo automóvil de transporte público y trayecto fijo que se emplea habitualmente en el servicio urbano.\n2. Vehículo automóvil de gran capacidad concebido para el transporte de personas, que generalmente realiza largos recorridos por carretera.","video":"https://panel.fundacioncnse-dilse.org/storage/autobus.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/autobus.png"},{"word":"Autopista","entry":"autopista","definition":"Carretera con calzadas separadas para los dos sentidos de la circulación, cada una de ellas con dos o más carriles, sin cruces a nivel.","video":"https://panel.fundacioncnse-dilse.org/storage/autopista.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/autopista.png"},{"word":"Avión","entry":"avión","definition":"Aeronave más pesada que el aire, provista de alas, cuya sustentación y avance son consecuencia de la acción de uno o varios motores.","video":"https://panel.fundacioncnse-dilse.org/storage/avion.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/avion.png"},{"word":"Ayer","entry":"ayer","definition":"En el día que precede inmediatamente al de hoy.","video":"https://panel.fundacioncnse-dilse.org/storage/ayer.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/ayer.png"},{"word":"Ayudar","entry":"ayudar","definition":"1. Prestar cooperación.\n2. Auxiliar, socorrer.","video":"https://panel.fundacioncnse-dilse.org/storage/ayudar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/ayudar.png"},{"word":"Ayuntamiento","entry":"ayuntamiento","definition":"Corporación compuesta por el alcalde y varios concejales para la administración de los intereses de un municipio.","video":"https://panel.fundacioncnse-dilse.org/storage/ayuntamiento.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/ayuntamiento.png"},{"word":"Azafato/a","entry":"azafato, ta","definition":"1. Persona encargada de atender a los pasajeros a bordo de un avión, de un tren, de un autocar, etc.\n2. Empleado de compañías de aviación, ajo-estatura.png"},{"word":"Baloncesto","entry":"baloncesto","definition":"Juego entre dos equipos de cinco jugadores cada uno, cuyo objetivo es introducir el balón en la cesta o canasta del contrario, situada a una altura determinada.","video":"https://panel.fundacioncnse-dilse.org/storage/baloncesto.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/baloncesto.png"},{"word":"Banco (dinero)","entry":"banco","definition":"Empresa dedicada a realizar operaciones financieras con el dinero procedente de sus accionistas y de los depósitos de sus clientes.","video":"https://panel.fundacioncnse-dilse.org/storage/banco.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/banco.png"},{"word":"Bar","entry":"bar","definition":"Local en que se despachan bebidas que suelen tomarse de pie, ante el mostrador.","video":"https://panel.fundacioncnse-dilse.org/storage/bar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/bar.png"},{"word":"Barba","entry":"barba","definition":"Pelo que nace debajo de la boca y en las mejillas de una persona.","video":"https://panel.fundacioncnse-dilse.org/storage/barba.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/barba.png"},{"word":"Barcelona","entry":"Barcelona","definition":"1. Ciudad española que está localizada en la parte noreste de España.\n2. Provincia la comunidad autónoma de Cataluña.\n3. Capital de la provincia que lleva el mismo nombre.\n4. Capital de la comunidad autónoma de Cataluña.","video":"https://panel.fundacioncnse-dilse.org/storage/barcelona.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/barcelona.png"},{"word":"Barco","entry":"barco","definition":"Embarcación de estructura cóncava y, generalmente, de grandes dimensiones.","video":"https://panel.fundacioncnse-dilse.org/storage/barco.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/barco.png"},{"word":"Barrer","entry":"barrer","definition":"1. Limpiar un lugar arrastrando la suciedad con algo como una escoba.\n2. Limpiar la suciedad de un lugar arrastrándola con algo como una escoba.","video":"https://panel.fundacioncnse-dilse.org/storage/barrer.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/barrer.png"},{"word":"Bastante","entry":"bastante","definition":"1. Suficiente, que basta.\n2. Una cantidad que basta, que es suficiente.","video":"https://panel.fundacioncnse-dilse.org/storage/bastante-suficiente.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/bastante-suficiente.png"},{"word":"Bañera","entry":"bañera","definition":"Recipiente hondo y alargado con espacio suficiente para que una persona pueda bañarse en él tendida o sentada.","video":"https://panel.fundacioncnse-dilse.org/storage/banera.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/banera.png"},{"word":"Beber","entry":"beber","definition":"Acción de ingerir un líquido.","video":"https://panel.fundacioncnse-dilse.org/storage/beber.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/beber.png"},{"word":"Besar","entry":"besar","definition":"Tocar u oprimir con un movimiento de labios a alguien o algo como expresión de amor, deseo o reverencia, o como saludo.","video":"https://panel.fundacioncnse-dilse.org/storage/besar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/besar.png"},{"word":"Beso","entry":"beso","definition":"1. Acción y efecto de besar.\n2. Ademán simbólico de besar.","video":"https://panel.fundacioncnse-dilse.org/storage/beso.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/beso.png"},{"word":"Biblioteca","entry":"biblioteca","definition":"1. Institución cuya finalidad consiste en la adquisición, conservación, estudio y exposición de libros y documentos.\n2. Lugar donde se tiene considerable número de libros ordenados para la lectura.","video":"https://panel.fundacioncnse-dilse.org/storage/biblioteca.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/biblioteca.png"},{"word":"Bicicleta","entry":"bicicleta","definition":"Vehículo de dos var dinero, documentos, objetos de uso personal, etc.","video":"https://panel.fundacioncnse-dilse.org/storage/bolso.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/bolso.png"},{"word":"Bolígrafo","entry":"bolígrafo","definition":"Instrumento para escribir que tiene en su interior un tubo de tinta especial y, en la punta, una bolita metálica que gira libremente.","video":"https://panel.fundacioncnse-dilse.org/storage/boligrafo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/boligrafo.png"},{"word":"Bombero/a","entry":"bombero, ra","definition":"Persona que tiene por oficio extinguir incendios y prestar ayuda en otros siniestros.","video":"https://panel.fundacioncnse-dilse.org/storage/bombero.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/bombero.png"},{"word":"Bosque","entry":"bosque","definition":"Sitio poblado de árboles y matas.","video":"https://panel.fundacioncnse-dilse.org/storage/bosque.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/bosque.png"},{"word":"Botella","entry":"botella","definition":"Recipiente de cristal, vidrio, plástico u otro material, con el cuello estrecho, que sirve para contener líquidos.","video":"https://panel.fundacioncnse-dilse.org/storage/botella.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/botella.png"},{"word":"Braga (prenda interior)","entry":"braga","definition":"Prenda interior femenina e infantil, que cubre desde la parte inferior del tronco y tiene dos aberturas en las piernas.","video":"https://panel.fundacioncnse-dilse.org/storage/braga-mujer.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/braga-mujer.png"},{"word":"Brazo","entry":"brazo","definition":"Miembro del cuerpo que comprende desde el hombro a la extremidad de la mano.","video":"https://panel.fundacioncnse-dilse.org/storage/brazo-cuerpo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/brazo-cuerpo.png"},{"word":"Buena suerte","entry":"suerte","definition":"Circunstancia de ser, por ioncnse-dilse.org/storage/bufanda.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/bufanda.png"},{"word":"Burgos","entry":"Burgos","definition":"1. Ciudad española que está localizada en la parte norte y central de España.\n2. Provincia de la comunidad autónoma de Castilla y León.\n3. Capital de la provincia que lleva el mismo nombre.","video":"https://panel.fundacioncnse-dilse.org/storage/burgos.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/burgos.png"},{"word":"Buscar (hallar)","entry":"buscar","definition":"1. Hacer algo para hallar a alguien o algo.\n2. Hacer lo necesario para conseguir algo.","video":"https://panel.fundacioncnse-dilse.org/storage/buscar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/buscar.png"},{"word":"Caballo","entry":"caballo","definition":"1. Mamífero de gran tamaño, con extremidades, cabeza y cuello largos, y que suele utilizarse como montura o animal de tiro.\n2. En el juego del ajedrez: Pieza cuya forma recuerda a la de un caballo y que se desplaza con movimientos en forma de L.\n3. En la baraja española: Carta que tiene respresentada la figura de un caballo con su jinete.","video":"https://panel.fundacioncnse-dilse.org/storage/caballo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/caballo.png"},{"word":"Cabeza","entry":"cabeza","definition":"Parte superior del cuerpo humano y superior o anterior de muchos animales, en la que están situados el cerebro y los principales órganos sensoriales.","video":"https://panel.fundacioncnse-dilse.org/storage/cabeza.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cabeza.png"},{"word":"Café","entry":"café","definition":"1. Semilla del cafeto, como de un centímetro de largo, de color amarillento verdoso, convexa por una parte y, por la otra, plana y con un surco longitudinal.\n2. Infusión que se hace con granos de café tostados y molidos.","video":"https://panel.fundacioncnse-dilse.org/storage/cafe.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cafe.png"},{"word":"Calefacción","entry":"calefacción","definition":"Conjunto de aparatos destinados a calentar un edificio o parte de él.","video":"https://panel.fundacioncnse-dilse.org/storage/calefaccion.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/calefaccion.png"},{"word":"Caliente","entry":"caliente","definition":"1. Que tiene o produce calor.\n2. Dicho de una habitación, de una vestidura, etc.: Que proporcionan calor y comodidad.","video":"https://panel.fundacioncnse-dilse.org/storage/caliente.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/caliente.png"},{"word":"Calle","entry":"calle","definition":"1. Vía pública, habitualmente asfaltada o empedrada, entre edificios o solares.\n2. Exterior urbano de los edificios.","video":"https://panel.fundacioncnse-dilse.org/storage/calle.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/calle.png"},{"word":"Caluroso","entry":"caluroso, sa","definition":"Que siente calor o lo causa.","video":"https://panel.fundacioncnse-dilse.org/storage/caluroso.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/caluroso.png"},{"word":"Calvo/a","entry":"calvo, va","definition":"Dicho de una persona: Que ha perdido el pelo de la cabeza.","video":"https://panel.fundacioncnse-dilse.org/storage/calvo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/calvo.png"},{"word":"Cama","entry":"cama","definition":"Mueble destinado a que las personas se acuesten en él, compuesto de una armazón, generalmente con patas, sobre la que se colocan un somier o tabla, un colchón, almohada y diversas ropas.","video":"https://panel.fundacioncnse-dilse.org/storage/cama_mon.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cama_mon.png"},{"word":"Camarero/a","entry":"camarero, ra","definition":"Persona que tiene por oficio servir consumiciones en restaurantes, bares u otros establecimientos similares.","video":"https://panel.fundacioncnse-dilse.org/storage/camarero.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/camarero.png"},{"word":"Cambiar (productos, objetos)","entry":"cambiar","definition":"Dar o tomar algo por otra cosa que se considera del mismo o análogo valor.","video":"https://panel.fundacioncnse-dilse.org/storage/cambiar-intercambio.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cambiar-intercambio.png"},{"word":"Camisa","entry":"camisa","definition":"Prenda de vestir de tela que cubre el torso, abotonada por delante, generalmente con cuello y mangas.","video":"https://panel.fundacioncnse-dilse.org/storage/camisa.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/camisa.png"},{"word":"Camión","entry":"camión","definition":"Vehículo de cuatro o más ruedas que se usa para transportar grandes cargas.","video":"https://panel.fundacioncnse-dilse.org/storage/camion.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/camion.png"},{"word":"Camping","entry":"camping","definition":"Campamento (lugar al aire libre).","video":"https://panel.fundacioncnse-dilse.org/storage/camping-campamento.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/camping-campamento.png"},{"word":"Campo","entry":"campo","definition":"Terreno extenso fuera de población, ciudad, villa o lugar.","video":"https://panel.fundacioncnse-dilse.org/storage/campo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/campo.png"},{"word":"Canarias","entry":"Canarias","definition":"Archipiélago situado en el océano Atlántico, que conforma una comunidad autónoma español en el noroeste de África","video":"https://panel.fundacioncnse-dilse.org/storage/canarias.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/canarias.png"},{"word":"Cansado/a","entry":"cansado, da","definition":"Persona que no tiene fuerzas.","video":"https://panel.fundacioncnse-dilse.org/storage/cansado-fisico.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cansado-fisico.png"},{"word":"Cantabria","entry":"Cantabria","definition":"Comunidad autónoma que está localizada en la parte norte y central de España, formada por una única provincia y cuya capital es Santander.","video":"https://panel.fundacioncnse-dilse.org/storage/cantabria.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cantabria.png"},{"word":"Cantante","entry":"cantante","definition":"1. Persona que canta por profesión.\n2. Dicho de una persona: Que canta.","video":"https://panel.fundacioncnse-dilse.org/storage/cantante.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cantante.png"},{"word":"Cara","entry":"cara","definition":"Parte anterior de la cabeza humana desde el principio de la frente hasta la punta de la barbilla.","video":"https://panel.fundacioncnse-dilse.org/storage/cara-cuerpo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cara-cuerpo.png"},{"word":"Carne","entry":"carné","definition":"Documento expedido a favor de una persona, generalmente en forma de tarjeta y provisto de su fotografía, que sirve para acreditar su identidad, su pertenencia a un colectivo o su facultad para realizar una actividad.","video":"https://panel.fundacioncnse-dilse.org/storage/carne-identidad.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/carne-identidad.png"},{"word":"Caro/Cara (precio)","entry":"caro, ra","definition":"1. Que tiene un precio alto o más alto de lo normal.\n2. Dicho de un precio: Alto o más alto de lo normal.\n3. Que hace pagar un precio alto, o más alto de lo normal, por sus servicios.\n4. Dicho especialmente de un lugar: Que requiere grandes gastos, o más altos de lo normal, para vivir.\n5. A un precio alto.\n6. Dicho de una persona: Que posee o a la que se le atribuyen cualidades positivas y que es de gran valía.","video":"https://panel.fundacioncnse-dilse.org/storage/caro.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/caro.png"},{"word":"Carrera/Correr","entry":"carrera","definition":"Acción de correr las personas o los animales.","video":"https://panel.fundacioncnse-dilse.org/storage/carrera-correr.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/carrera-correr.png"},{"word":"Carretera","entry":"carretera","definition":"Camino público, ancho y espacioso, pavimentado y dispuesto para el tránsito de vehículos.","video":"https://panel.fundacioncnse-dilse.org/storage/carretera.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/carretera.png"},{"word":"Carta (correo)","entry":"carta","definition":"Papel escrito, y ordinariamente cerrado, que una persona envía a otra para comunicarse con ella.","video":"https://panel.fundacioncnse-dilse.org/storage/carta.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/carta.png"},{"word":"Cartas (naipes)","entry":"carta (#echar las cartas)","definition":"Hacer con los naipes ciertas combinaciones con las que se pretende adivinar cosas ocultas o venideras.","video":"https://panel.fundacioncnse-dilse.org/storage/carta_echar_las.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/carta_echar_las.png"},{"word":"Casa","entry":"casa","definition":"1. Edificio para habitar.\n2. Edificio de una o pocas plantas destinado a vivienda unifamiliar, en oposición a piso.\n3. Piso (vivienda).\n4. Cabaña (espacio de la mesa de billar).","video":"https://panel.fundacioncnse-dilse.org/storage/casa.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/casa.png"},{"word":"Casado/a","entry":"casado, da","definition":"Dicho de una persona: Que ha contraído matrimonio.","video":"https://panel.fundacioncnse-dilse.org/storage/casado.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/casado.png"},{"word":"Castellón","entry":"Castellón","definition":"1. Ciudad española que está localizada en la parte central y este de España.\n2. Provincia de la comunidad autónoma de Comunidad Valenciana.","video":"https://panel.fundacioncnse-dilse.org/storage/castellon.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/castellon.png"},{"word":"Castilla la Mancha","entry":"Castilla-La Mancha","definition":"Comunidad autónoma que está localizada en la parte central de España, formada por 5 provincias y cuya capital es Toledo.","video":"https://panel.fundacioncnse-dilse.org/storage/castilla_la_mancha.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/castilla_la_mancha.png"},{"word":"Castilla León","entry":"Castilla y León","definition":"Comunidad autónoma que está localizada en la parte noroeste de España, formada por 9 provincias y sin capital declarada.","video":"https://panel.fundacioncnse-dilse.org/storage/castilla_y_leon.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/castilla_y_leon.png"},{"word":"Castillo","entry":"castillo","definition":"Construcción militar amurallada, situada generalmente en lugar elevado y provista de fosos, torres, almenas y otras fortificaciones, propia generalmente de la Edad Media.","video":"https://panel.fundacioncnse-dilse.org/storage/castillo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/castillo.png"},{"word":"Cataluña","entry":"Cataluña","definition":"Comunidad autónoma que está localizada en la parte noreste de España, formada por 4 provincias y cuya capital es Barcelona.","video":"https://panel.fundacioncnse-dilse.org/storage/cataluna.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cataluna.png"},{"word":"Catedral","entry":"catedral","definition":"Iglesia principal de una diócesis, en la que tiene su sede el obispo.","video":"https://panel.fundacioncnse-dilse.org/storage/catedral.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/catedral.png"},{"word":"Cazadora","entry":"cazadora","definition":"1. Especie de chaqueta usada por lo general para la caza y el deporte.\n2. Especie de chaqueta corta y ajustada a la cadera, de línea deportiva, hecha de material resistente, como paño, cuero, etc.","video":"https://panel.fundacioncnse-dilse.org/storage/cazadora.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cazadora.png"},{"word":"Caña (cerveza)","entry":"cana","definition":"Cabello que se ha vuelto blanco.","video":"https://panel.fundacioncnse-dilse.org/storage/cana.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cana.png"},{"word":"CD","entry":"CD","definition":"1. Disco óptico que se graba en forma digital, lo que permite acumular una gran cantidad de información.\n2. Aparato lector de discos compactos.","video":"https://panel.fundacioncnse-dilse.org/storage/cd.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cd.png"},{"word":"Cebolla","entry":"cebolla","definition":"Hortaliza de bulbo comestible, redondo, formado por capaz superpuestas, de olor fuerte y sabor más o menos picante.","video":"https://panel.fundacioncnse-dilse.org/storage/cebolla.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cebolla.png"},{"word":"Cenar/Cena","entry":"cenar","definition":"1. Tomar la cena.\n2. Comer en la cena una cosa.","video":"https://panel.fundacioncnse-dilse.org/storage/cenar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cenar.png"},{"word":"Centro comercial","entry":"centro (#centro comercial)","definition":"Complejo formado por establecimientos dedicados a actividades comerciales y de ocio.","video":"https://panel.fundacioncnse-dilse.org/storage/centro_comercial.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/centro_comercial.png"},{"word":"Cepillarse los dientes","entry":"cepillar (#cepillarse los dientes)","definition":"Quitar la suciedad del interior de la boca (dientes, encías, lengua…) con un cepillo de cerdas u otro objeto que desempeñe la misma función, usándolo con dentífrico.","video":"https://panel.fundacioncnse-dilse.org/storage/cepillarse-dientes.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cepillarse-dientes.png"},{"word":"Cepillo de dientes","entry":"cepillo (#cepillo de dientes)","definition":"Instrumento hecho de cerdas distribuidas en una armazón y unidas a un mango que sirve para la higiene bucal.","video":"https://panel.fundacioncnse-dilse.org/storage/cepillo-dientes.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cepillo-dientes.png"},{"word":"Cerca","entry":"cerca","definition":"Construcción a modo de tapia que se pone alrededor de algún lugar para cerrarlo, protegerlo o delimitarlo.","video":"https://panel.fundacioncnse-dilse.org/storage/cerca-valla.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cerca-valla.png"},{"word":"Cerca (Próxima, inmediatamente)","entry":"cerca","definition":"Próxima o inmediatamente en el espacio o en el tiempo.","video":"https://panel.fundacioncnse-dilse.org/storage/cerca_a.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cerca_a.png"},{"word":"Cerrado/a (carácter)","entry":"cerrado, da","definition":"Dicho de una persona: Muy callada, disimulada y silenciosa o torpe de entendimiento.","video":"https://panel.fundacioncnse-dilse.org/storage/cerrado.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cerrado.png"},{"word":"Cerveza","entry":"cerveza","definition":"Bebida alcohólica hecha con granos germinados de cebada u otros cereales fermentados en agua, y aromatizada con lúpulo, boj, casia, etc.","video":"https://panel.fundacioncnse-dilse.org/storage/cerveza.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cerveza.png"},{"word":"Ceuta","entry":"Ceuta","definition":"Ciudad autónoma española que está localizada en la parte norte y oeste de África.","video":"https://panel.fundacioncnse-dilse.org/storage/ceuta.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/ceuta.png"},{"word":"Chalé","entry":"chalé","definition":"Edificio de una o pocas plantas, con jardín, destinado especialmente a vivienda unifamiliar.","video":"https://panel.fundacioncnse-dilse.org/storage/chale.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/chale.png"},{"word":"Champán","entry":"champán","definition":"Vino espumoso blanco o rosado, originario de Francia.","video":"https://panel.fundacioncnse-dilse.org/storage/champan.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/champan.png"},{"word":"Champú","entry":"champú","definition":"Sustancia jabonosa para lavar el pelo y el cuero cabelludo.","video":"https://panel.fundacioncnse-dilse.org/storage/champu.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/champu.png"},{"word":"Chaqueta","entry":"chaqueta","definition":"Prenda exterior de vestir, con mangas y abierta por delante, que llega por debajo de la cadera.","video":"https://panel.fundacioncnse-dilse.org/storage/chaqueta.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/chaqueta.png"},{"word":"Chat/chatear","entry":"chatear","definition":"Mantener una conversación mediante chats.","video":"https://panel.fundacioncnse-dilse.org/storage/chatear.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/chatear.png"},{"word":"China","entry":"China","definition":"País localizado en el este de Asia.","video":"https://panel.fundacioncnse-dilse.org/storage/china.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/china.png"},{"word":"Chocolate","entry":"chocolate","definition":"Pasta hecha con cacao y azúcar molidos, a la que generalmente se añade canela o vainilla.","video":"https://panel.fundacioncnse-dilse.org/storage/chocolate.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/chocolate.png"},{"word":"Cielo","entry":"cielo","definition":"1. Esfera aparente que rodea la Tierra, azul en los días despejados y gris en los nublados.\n2. Atmósfera (capa que rodea la Tierra).","video":"https://panel.fundacioncnse-dilse.org/storage/cielo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cielo.png"},{"word":"Ciencia","entry":"ciencia","definition":"Conjunto de conocimientos obtenidos mediante la observación y el razonamiento, sistemáticamente estructurados y de los que se deducen principios y leyes generales.","video":"https://panel.fundacioncnse-dilse.org/storage/ciencia.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/ciencia.png"},{"word":"Cine","entry":"cine","definition":"1. Local o sala donde como espectáculo se exhiben las películas cinematográficas.\n2. Conjunto de películas cinematográficas.","video":"https://panel.fundacioncnse-dilse.org/storage/cine.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cine.png"},{"word":"Ciudad Real","entry":"Ciudad Real","definition":"1. Ciudad española que está localizada en la parte central de España.\n2. Provincia de la comunidad autónoma de Castilla-La Mancha.\n3. Capital de la provincia que lleva el mismo nombre.","video":"https://panel.fundacioncnse-dilse.org/storage/ciudad_real.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/ciudad_real.png"},{"word":"Claro/a","entry":"claro, ra","definition":"1. Dicho de un color: Que tiende al blanco, o se le acerca más que otro de la misma clase.\n2. Inteligible, fácil de comprender.\n3. De manera clara.\n4. De color claro.\n5. Que se percibe o se distingue bien.","video":"https://panel.fundacioncnse-dilse.org/storage/claro-color.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/claro-color.png"},{"word":"Clase","entry":"clase","definition":"1. Conjunto de elementos con caracteres comunes.\n2. Distinción, categoría.\n3. Conjunto de personas del mismo grado, calidad u oficio.\n4. Grupo taxonómico que comprende varios órdenes de plantas o de animales con muchos caracteres comunes.\n5. Categoría o conjunto de objetos o individuos que comparten características comunes que son fundamentales para comprensión de la estructura del mundo natural, el razonamiento lógico y la la clasificación de fenómenos.","video":"https://panel.fundacioncnse-dilse.org/storage/clase-seccion.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/clase-seccion.png"},{"word":"Cliente","entry":"cliente, ta","definition":"1. Persona que compra en una tienda, o que utiliza con asiduidad los servicios de un profesional o empresa.\n2. Programa o dispositivo que solicita determinados servicios a un servidor del que depende.","video":"https://panel.fundacioncnse-dilse.org/storage/cliente.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cliente.png"},{"word":"Coche/Conducir","entry":"coche","definition":"Automóvil destinado al transporte de personas y con capacidad no superior a siete plazas.","video":"https://panel.fundacioncnse-dilse.org/storage/coche.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/coche.png"},{"word":"Cocina","entry":"cocina","definition":"Habitación donde se guisa y se cocinan los alimentos.","video":"https://panel.fundacioncnse-dilse.org/storage/cocina_ma.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cocina_ma.png"},{"word":"Cocinar","entry":"cocinar","definition":"Guisar, aderezar los alimentos.","video":"https://panel.fundacioncnse-dilse.org/storage/cocinar_mp.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cocinar_mp.png"},{"word":"Coger/Descolgar teléfono","entry":"descolgar","definition":"Levantar el auricular del teléfono.","video":"https://panel.fundacioncnse-dilse.org/storage/descolgar-telefono.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/descolgar-telefono.png"},{"word":"Colegio","entry":"colegio","definition":"1. Establecimiento de enseñanza para niños y jóvenes.\n2. Edificio del colegio.","video":"https://panel.fundacioncnse-dilse.org/storage/colegio.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/colegio.png"},{"word":"Colgar teléfono","entry":"colgar","definition":"Colocar el auricular del teléfono en su sitio interrumpiendo o dando por terminada una conversación telefónica.","video":"https://panel.fundacioncnse-dilse.org/storage/colgar-telefono.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/colgar-telefono.png"},{"word":"Collar (complemento)","entry":"collar","definition":"Adorno que ciñe o rodea el cuello.","video":"https://panel.fundacioncnse-dilse.org/storage/collar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/collar.png"},{"word":"Color","entry":"color","definition":"Sensación producida en el ojo por los rayos de luz que los cuerpos absorben y reflejan, variable en función de la longitud de onda de dichos rayos.","video":"https://panel.fundacioncnse-dilse.org/storage/color.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/color.png"},{"word":"Comer/Comida","entry":"comida","definition":"1. Lo que se come y bebe para nutrirse.\n2. Alimento que se toma al mediodía o primeras horas de la tarde.","video":"https://panel.fundacioncnse-dilse.org/storage/comida.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/comida.png"},{"word":"Compañero/a","entry":"compañero, ra","definition":"1. Persona que se acompaña con otra para algún fin.\n2. Cada uno de los individuos de que se compone un cuerpo o una comunidad, como un cabildo, un colegio, etc.\n3. En varios juegos, cada uno de los jugadores que se unen y ayudan contra los otros.","video":"https://panel.fundacioncnse-dilse.org/storage/companero.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/companero.png"},{"word":"Comunidad de Madrid","entry":"comunidad (#Comunidad de Madrid)","definition":"Comunidad autónoma que está localizada en la parte central de España, formada por una única provincia y cuya capital es Madrid.","video":"https://panel.fundacioncnse-dilse.org/storage/comunidad_madrid.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/comunidad_madrid.png"},{"word":"Comunidad Valenciana","entry":"comunidad (#Comunidad Valenciana)","definition":"Comunidad autónoma que está localizada en la parte sureste y este de España, formada por 3 provincias y cuya capital es Valencia.","video":"https://panel.fundacioncnse-dilse.org/storage/comunidad_valenciana.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/comunidad_valenciana.png"},{"word":"Con","entry":"con","definition":"Juntamente y en compañía.","video":"https://panel.fundacioncnse-dilse.org/storage/con_.mov","photo":"https://panel. torage/cuerpo-tronco.png"},{"word":"Cuidado (atención, cuidar)","entry":"cuidado","definition":"1. Solicitud y atención para hacer bien algo.\n2. Acción de cuidar (asistir, guardar, conservar).\n3. Con sentido ponderativo o para llamar la atención.","video":"https://panel.fundacioncnse-dilse.org/storage/cuidado.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cuidado.png"},{"word":"Cuidar","entry":"cuidar","definition":"1. Poner diligencia, atención y solicitud en la ejecución de algo.\n2. Asistir, guardar, conservar.\n3. Mirar por la propia salud, darse buena vida.","video":"https://panel.fundacioncnse-dilse.org/storage/cuidar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cuidar.png"},{"word":"Cultura (conocimientos)","entry":"cultura","definition":"Conjunto de conocimientos que permite a alguien desarrollar su juicio crítico.","video":"https://panel.fundacioncnse-dilse.org/storage/cultura-conocimientos.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cultura-conocimientos.png"},{"word":"Cumpleaños","entry":"cumpleaños","definition":"Aniversario del nacimiento de una persona.","video":"https://panel.fundacioncnse-dilse.org/storage/cumpleanos.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cumpleanos.png"},{"word":"Cuna","entry":"cuna","definition":"Cama pequeña para niños, con bordes altos o barandillas laterales, a veces dispuesta para poderla mecer.","video":"https://panel.fundacioncnse-dilse.org/storage/cuna.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cuna.png"},{"word":"Curso","entry":"curso","definition":"1. En un centro de enseñanza, tiempo señalado en cada año para asistir a oír las lecciones.\n2. Estudio sobre una materia, desarrollada con unidad.","video":"https://panel.fundacioncnse-dilse.org/storage/curso.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/curso.png"},{"word":"Cuñado/a","entry":"cuñado, da","definition":"1. Hermano del cónyuge de una persona.\n2. Cónyuge del hermano tar (arrojar violentamente por la boca).","video":"https://panel.fundacioncnse-dilse.org/storage/devolver-vomitar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/devolver-vomitar.png"},{"word":"Diccionario","entry":"diccionario","definition":"Repertorio en forma de libro o en soporte electrónico en el que se recogen, según un orden determinado, las palabras o expresiones de una o más lenguas, o de una materia concreta, acompañadas de su definición, equivalencia o explicación.","video":"https://panel.fundacioncnse-dilse.org/storage/diccionario.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/diccionario.png"},{"word":"Diciembre","entry":"diciembre","definition":"Duodécimo mes del año, que tiene 31 días.","video":"https://panel.fundacioncnse-dilse.org/storage/diciembre.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/diciembre.png"},{"word":"Diente","entry":"diente","definition":"Pieza dura y blanquecina de las que crecen en las mandíbulas del hombre y de muchos animales, que sirve como órgano de la masticación o de defensa.","video":"https://panel.fundacioncnse-dilse.org/storage/diente.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/diente.png"},{"word":"Diferente","entry":"diferente","definition":"Diverso, distinto.","video":"https://panel.fundacioncnse-dilse.org/storage/diferente.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/diferente.png"},{"word":"Difícil","entry":"difícil","definition":"Que no se consigue, realiza o entiende sin mucho esfuerzo o habilidad.","video":"https://panel.fundacioncnse-dilse.org/storage/dificil.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/dificil.png"},{"word":"Dinero","entry":"dinero","definition":"Moneda corriente.","video":"https://panel.fundacioncnse-dilse.org/storage/dinero.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/dinero.png"},{"word":"Diploma","entry":"diploma","definition":"Título o credencial que expide una corporación, una facultad, una sociedad literaria, etc., para acreditar un grado académico, una prerrogativa, un premio, etc.","video":"https://panel.fundacioncnse-dilse.org/storage/diploma.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/diploma.png"},{"word":"Dirección (domicilio)","entry":"dirección","definition":"1. Domicilio (lugar en que alguien se considera establecido).\n2. Señas que indican dónde y a quién se envía una carta, documento o bulto.","video":"https://panel.fundacioncnse-dilse.org/storage/direccion-domicilio.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/direccion-domicilio.png"},{"word":"Director/a","entry":"director, ra","definition":"Persona que dirige algo en razón de su profesión o de su cargo.","video":"https://panel.fundacioncnse-dilse.org/storage/director.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/director.png"},{"word":"Discapacidad","entry":"discapacidad","definition":"Condición de discapacitado.","video":"https://panel.fundacioncnse-dilse.org/storage/discapacidad.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/discapacidad.png"},{"word":"Disculpa","entry":"disculpar","definition":"1. Dar razones o pruebas que descarguen de una culpa o delito\n2. Pedir indulgencia por lo que ha causado o puede causar daño.","video":"https://panel.fundacioncnse-dilse.org/storage/disculpar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/disculpar.png"},{"word":"Divorciado/a","entry":"divorciado, da","definition":"Dicho de una persona: Que se ha divorciado legalmente.","video":"https://panel.fundacioncnse-dilse.org/storage/divorciado.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/divorciado.png"},{"word":"Dolor (daño)","entry":"dolor","definition":"1. Sensación molesta y aflictiva de una parte del cuerpo por causa interior o exterior.\n2. Sentimiento de pena y congoja.","video":"https://panel.fundacioncnse-dilse.org/storage/dolor.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/dolor.png"},{"word":"Domingo","entry":"domingo","definition":"Séptimo día de la semana, que es festivo para el cristianismo y, en general, en el mundo occidental.","video":"https://panel.fundacioncnse-dilse.org/storage/domingo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/domingo.png"},{"word":"Dormir","entry":"dormir","definition":"Hallarse en el estado de reposo que consiste en la inacción o suspensión de los sentidos y de todo movimiento voluntario.","video":"https://panel.fundacioncnse-dilse.org/storage/dormir.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/dormir.png"},{"word":"Ducha","entry":"ducha","definition":"1. Acción y efecto de duchar.\n2. Proyección de agua que, en forma de lluvia o de chorro, se hace caer en el cuerpo para limpiarlo o refrescarlo, o con propósito medicinal.\n3. Aparato o instalación que sirve para ducharse.\n4. Habitación o lugar donde hay una ducha.","video":"https://panel.fundacioncnse-dilse.org/storage/ducha.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/ducha.png"},{"word":"Dueño/a","entry":"dueño, ña","definition":"Persona que tiene dominio o propiedad sobre algo.","video":"https://panel.fundacioncnse-dilse.org/storage/dueno.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/dueno.png"},{"word":"Dulce","entry":"dulce","definition":"1. Que causa cierta sensación suave y agradable al paladar, como la producida por la miel, el azúcar, etc.\n2. Fruta o cualquier otra cosa cocida o preparada con almíbar o azúcar.","video":"https://panel.fundacioncnse-dilse.org/storage/dulce-sabor.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/dulce-sabor.png"},{"word":"DVD","entry":"DVD","definition":"1. Disco óptico capaz de contener en forma codificada gran cantidad de imágenes, sonidos o datos.\n2. Aparato que graba digitalmente en un DVD o reproduce a partir de él imágenes, sonidos o datos.","video":"https://panel.fundacioncnse-dilse.org/storage/dvd.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/dvd.png"},{"word":"Dónde","entry":"dónde","definition":"1. En qué lugar.\n2. A qué lugar.","video":"https://panel.fundacioncnse-dilse.org/storage/donde.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/donde.png"},{"word":"Edificio","entry":"edificio","definition":"Construcción estable, hecha con materiales resistentes, para ser habitada o para otros usos.","video":"https://panel.fundacioncnse-dilse.org/storage/edificio.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/edificio.png"},{"word":"Empeorar","entry":"empeorar","definition":"Hacer que aquel o aquello que ya era o estaba malo, sea o se ponga peor.","video":"https://panel.fundacioncnse-dilse.org/storage/empeorar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/empeorar.png"},{"word":"Empresa","entry":"empresa","definition":"Unidad de organización dedicada a actividades industriales, mercantiles o de prestación de servicios con fines lucrativos.","video":"https://panel.fundacioncnse-dilse.org/storage/empresa.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/empresa.png"},{"word":"En","entry":"en","definition":"Denota en qué modo se realiza lo expresado por el verbo a que se refiere.","video":"https://panel.fundacioncnse-dilse.org/storage/en.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/en.png"},{"word":"En punto (hora)","entry":"punto (#en punto)","definition":"Dicho de una hora: Exactamente.","video":"https://panel.fundacioncnse-dilse.org/storage/punto_en.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/punto_en.png"},{"word":"Encantado/a","entry":"encantado, da","definition":"1. Se aplica al que se encuentra muy bien o muy a gusto de cierta manera, con ciertas cosas o personas, en cierto sitio, etc.\n2. Se usa como fórmula de saludo en las presentaciones en sociedad.","video":"https://panel.fundacioncnse-dilse.org/storage/encantado.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/encantado.png"},{"word":"Encantar (gustar)","entry":"encantar","definition":"Gustar en gran medida, agradar mucho.","video":"https://panel.fundacioncnse-dilse.org/storage/encantar-gustar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/encantar-gustar.png"},{"word":"Enero","entry":"enero","definition":"Primer mes del año, que tiene 31 días.","video":"https://panel.fundacioncnse-dilse.org/storage/enero.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/enero.png"},{"word":"Enfado/Enfadar","entry":"enfado","definition":"1. Enojo (movimiento del ánimo que suscita ira).\n2. Impresión desagradable y molesta que hacen en el ánimo algunas cosas.","video":"https://panel.fundacioncnse-dilse.org/storage/enfado.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/enfado.png"},{"word":"Enfermero/a","entry":"enfermero, ra","definition":"Persona dedicada a la asistencia de los enfermos.","video":"https://panel.fundacioncnse-dilse.org/storage/enfermero.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/enfermero.png"},{"word":"Enfermo/a","entry":"enfermo, ma","definition":"Que padece enfermedad.","video":"https://panel.fundacioncnse-dilse.org/storage/enfermo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/enfermo.png"},{"word":"Enfrente / Delante","entry":"delante (#delante de)","definition":"Frente a (enfrente de).","video":"https://panel.fundacioncnse-dilse.org/storage/delante-enfrente.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/delante-enfente.png"},{"word":"Ensalada","entry":"ensalada","definition":"Hortaliza o conjunto de hortalizas mezcladas, cortadas en trozos y aderezadas con sal, aceite, vinagre y otros ingredientes.","video":"https://panel.fundacioncnse-dilse.org/storage/ensalada.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/ensalada.png"},{"word":"Enseñar","entry":"enseñar","definition":"Instruir, doctrinar, amaestrar con reglas o preceptos.","video":"https://panel.fundacioncnse-dilse.org/storage/ensenar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/ensenar.png"},{"word":"Entender","entry":"entender","definition":"1. Tener idea clara de las cosas.\n2. Conocer el ánimo o la intención de alguien.","video":"https://panel.fundacioncnse-dilse.org/storage/entender.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/entender.png"},{"word":"Entonces","entry":"entonces","definition":"1. En ese caso, por tanto o siendo así.\n2. Pues entonces.","video":"https://panel.fundacioncnse-dilse.org/storage/entonces.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/entonces.png"},{"word":"Entrada","entry":"entrada","definition":"1. Espacio por donde se entra a alguna parte.\n2. Acción de entrar en alguna parte.\n3. En viviendas, hoteles, etc., pieza o estancia próxima a la puerta principal.","video":"https://panel.fundacioncnse-dilse.org/storage/entrada-lugar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/entrada-lugar.png"},{"word":"Entrar","entry":"entrar","definition":"Ir o pasar de fuera adentro.","video":"https://panel.fundacioncnse-dilse.org/storage/entrar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/entrar.png"},{"word":"Entre (época)","entry":"entre","definition":"Denota un tiempo intermedio.","video":"https://panel.fundacioncnse-dilse.org/storage/entre.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/entre.png"},{"word":"Envejecer","entry":"envejecer","definition":"Dicho de una persona o de una cosa: Hacerse vieja o antigua.","video":"https://panel.fundacioncnse-dilse.org/storage/envejecer.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/envejecer.png"},{"word":"Error","entry":"error","definition":"1. Concepto equivocado o juicio falso.\n2. Acción desacertada o equivocada.\n3. Cosa hecha erradamente.","video":"https://panel.fundacioncnse-dilse.org/storage/error.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/error.png"},{"word":"Escalera","entry":"escalera","definition":"Conjunto de peldaños o escalones que enlazan dos planos a distinto nivel en una construcción o terreno, y que sirven para subir y bajar.","video":"https://panel.fundacioncnse-dilse.org/storage/escalera.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/escalera.png"},{"word":"Escribir","entry":"escribir","definition":"Representar las palabras o las ideas con letras u otros signos trazados en papel u otra superficie.","video":"https://panel.fundacioncnse-dilse.org/storage/escribir.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/escribir.png"},{"word":"Espalda","entry":"espalda","definition":"Parte posterior del cuerpo humano, desde los hombros hasta la cintura.","video":"https://panel.fundacioncnse-dilse.org/storage/espalda.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/espalda.png"},{"word":"España","entry":"España","definition":"País localizado en el suroeste de Europa.","video":"https://panel.fundacioncnse-dilse.org/storage/espana.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/espana.png"},{"word":"Especifico","entry":"específico, ca","definition":"1. Que es propio de algo y lo caracteriza y distingue de otras cosas.\n2. Concreto (preciso, determinado).\n3. Dicho especialmente de un medicamento: Que está indicado para curar una determinada enfermedad.","video":"https://panel.fundacioncnse-dilse.org/storage/especifico.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/especifico.png"},{"word":"Espejo","entry":"espejo","definition":"Superficie de cristal cubierto con mercurio por la parte posterior, o de metal pulido, en la que se refleja la luz y los objetos situados delante.","video":"https://panel.fundacioncnse-dilse.org/storage/espejo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/espejo.png"},{"word":"Esperar","entry":"esperar","definition":"Tener esperanza de conseguir lo que se desea.","video":"https://panel.fundacioncnse-dilse.org/storage/esperar-esperanza.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/esperar-esperanza.png"},{"word":"Esperar (paro)","entry":"esperar","definition":"Tener esperanza de conseguir lo que se desea.","video":"https://panel.fundacioncnse-dilse.org/storage/esperar-esperanza.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/esperar-esperanza.png"},{"word":"Esperar (permanecer en sitio)","entry":"esperar","definition":"Permanecer en sitio adonde se cree que ha de ir alguien o en donde se presume que ha de ocurrir algo.","video":"https://panel.fundacioncnse-dilse.org/storage/esperar_a.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/esperar_b.png"},{"word":"Esquí/Esquiar","entry":"esquiar","definition":"Patinar con esquís.","video":"https://panel.fundacioncnse-dilse.org/storage/esquiar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/esquiar.png"},{"word":"Estación","entry":"estación","definition":"Cada una de las cuatro partes o tiempos en que se divide el año.","video":"https://panel.fundacioncnse-dilse.org/storage/estacion-ano.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/estacion.png"},{"word":"Este","entry":"este","definition":"1. Punto cardinal del horizonte por donde sale el sol en los equinoccios.\n2. Región o territorio situado en la parte este de un país o de un área geográfica determinada.\n3. Lugar situado al este de otro lugar con cuya posición se compara.","video":"https://panel.fundacioncnse-dilse.org/storage/este-punto_cardinal.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/este-punto_cardinal.png"},{"word":"Estrella","entry":"estrella","definition":"Cada uno de los cuerpos celestes que brillan en la noche, excepto la Luna.","video":"https://panel.fundacioncnse-dilse.org/storage/estrella.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/estrella.png"},{"word":"Estudiante","entry":"estudiante","definition":"Persona que cursa estudios en un centro de enseñanza.","video":"https://panel.fundacioncnse-dilse.org/storage/estudiante.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/estudiante.png"},{"word":"Estudiar","entry":"estudiar","definition":"1. Ejercitar el entendimiento para alcanzar o comprender algo.\n2. Recibir enseñanzas en las universidades o en otros centros docentes.\n3. Aprender (fijar en la memoria).","video":"https://panel.fundacioncnse-dilse.org/storage/estudiar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/estudiar.png"},{"word":"Estupendo/a","entry":"estupendo, da","definition":"Admirable, asombroso, pasmoso.","video":"https://panel.fundacioncnse-dilse.org/storage/estupendo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/estupendo.png"},{"word":"Estómago","entry":"estómago","definition":"Parte ensanchada del aparato digestivo, situada entre el esófago y el intestino, cuyas paredes segregan los fermentos gástricos.","video":"https://panel.fundacioncnse-dilse.org/storage/estomago.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/estomago.png"},{"word":"Euro","entry":"euro","definition":"Unidad monetaria común a los estados de la Unión Económica y Monetaria europea.","video":"https://panel.fundacioncnse-dilse.org/storage/euro.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/euro.png"},{"word":"Euskadi","entry":"Euskadi ta akatasuna (ETA)","definition":"Organización terrorista independentista vasca, cuyo objetivo es la independencia del País Vasco respecto del Estado Español.","video":"https://panel.fundacioncnse-dilse.org/storage/eta.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/eta.png"},{"word":"Examen","entry":"examen","definition":"Prueba que se hace de la idoneidad de una persona para el ejercicio y profesión de una facultad, oficio o ministerio, o para comprobar o demostrar el aprovechamiento en los estudios.","video":"https://panel.fundacioncnse-dilse.org/storage/examen.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/examen.png"},{"word":"Excursión","entry":"excursión","definition":"Ida a alguna ciudad, museo o lugar para estudio, recreo o ejercicio físico.","video":"https://panel.fundacioncnse-dilse.org/storage/excursion.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/excursion.png"},{"word":"Exposición","entry":"exposición","definition":"1. Acción y efecto de exponer.\n2. Explicación de un tema o asunto por escrito o de palabra.","video":"https://panel.fundacioncnse-dilse.org/storage/exposicion-presentacion.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/exposicion-presentacion.png"},{"word":"Exterior","entry":"exterior","definition":"1. Que está por la parte de fuera.\n2. Dicho de una habitación o de una vivienda: Que tiene vistas a la calle.","video":"https://panel.fundacioncnse-dilse.org/storage/exterior.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/exterior.png"},{"word":"Extranjero","entry":"extranjero, ra","definition":"1. Dicho de un país: Que no es el propio.\n2. Natural de un país extranjero.\n3. Propio de una persona extranjera.\n4. Perteneciente o relativo a un país extranjero o al conjunto de ellos.","video":"https://panel.fundacioncnse-dilse.org/storage/extranjero.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/extranjero.png"},{"word":"Extremadura","entry":"Extremadura","definition":"Comunidad autónoma que está localizada en la parte suroeste de España, formada por 2 provincias y cuya capital es Mérida.","video":"https://panel.fundacioncnse-dilse.org/storage/extremadura.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/extremadura.png"},{"word":"Fabricar","entry":"fabricar","definition":"Producir objetos en serie, generalmente por medios mecánicos.","video":"https://panel.fundacioncnse-dilse.org/storage/fabricar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/fabricar.png"},{"word":"Familia","entry":"familia","definition":"1. Grupo de personas emparentadas entre sí que viven juntas.\n2. Conjunto de ascendientes, descendientes, colaterales y afines de un linaje.\n3. Hijos o descendencia.","video":"https://panel.fundacioncnse-dilse.org/storage/familia.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/familia.png"},{"word":"Famoso/a","entry":"famoso, sa","definition":"Ampliamente conocido.","video":"https://panel.fundacioncnse-dilse.org/storage/famoso-fama.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/famoso-fama.png"},{"word":"Farmacia","entry":"farmacia","definition":"1. Ciencia que enseña a preparar y combinar productos naturales o artificiales como remedios de las enfermedades, o para conservar la salud.\n2. Establecimiento en que se preparan y venden medicamentos.","video":"https://panel.fundacioncnse-dilse.org/storage/farmacia.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/farmacia.png"},{"word":"Fax","entry":"fax","definition":"1. Sistema que permite transmitir a distancia por la línea telefónica escritos o gráficos.\n2. Documento recibido por fax.","video":"https://panel.fundacioncnse-dilse.org/storage/fax.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/fax.png"},{"word":"Feo/a","entry":"feo, a","definition":"1. Desprovisto de belleza y hermosura.\n2. Que causa desagrado o aversión.","video":"https://panel.fundacioncnse-dilse.org/storage/feo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/feo.png"},{"word":"Fiebre","entry":"fiebre","definition":"Aumento anormal de la temperatura del cuerpo, con aceleración del pulso y de la respiración.","video":"https://panel.fundacioncnse-dilse.org/storage/fiebre.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/fiebre.png"},{"word":"Fiesta","entry":"fiesta","definition":"1. Día en que, por disposición legal, no se trabaja.\n2. Día que una religión celebra con especial solemnidad dedicándolo a Dios o conmemorando un hecho o figura religiosos.\n3. Jornada en que se celebra algo o que se dedica a alguien o algo.\n4. Descanso laboral que se hace en un día que no es festivo.\n5. Acto o conjunto de actos organizados para la diversión o disfrute de una colectividad.\n6. Reunión de gente para celebrar algo o divertirse.","video":"https://panel.fundacioncnse-dilse.org/storage/fiesta.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/fiesta.png"},{"word":"Fin","entry":"fin","definition":"Objeto o motivo con que se ejecuta algo.","video":"https://panel.fundacioncnse-dilse.org/storage/fin.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/fin.png"},{"word":"Fin (dar fin)","entry":"fin","definition":"Objeto o motivo con que se ejecuta algo.","video":"https://panel.fundacioncnse-dilse.org/storage/fin.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/fin.png"},{"word":"Fin de semana","entry":"fin (#fin de semana)","definition":"Parte de la semana que comprende normalmente el sábado y el domingo.","video":"https://panel.fundacioncnse-dilse.org/storage/fin_semana.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/fin_semana.png"},{"word":"Firmar","entry":"firmar","definition":"Dicho de una persona: Poner su firma.","video":"https://panel.fundacioncnse-dilse.org/storage/firmar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/firmar.png"},{"word":"Flor","entry":"flor","definition":"Brote de muchas plantas, formado por hojas de colores, del que se formará el fruto.","video":"https://panel.fundacioncnse-dilse.org/storage/flor.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/flor.png"},{"word":"Fotocopiar/Fotocopia","entry":"fotocopiar","definition":"Reproducir algo mediante fotocopias.","video":"https://panel.fundacioncnse-dilse.org/storage/fotocopiar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/fotocopiar.png"},{"word":"Fotografía","entry":"fotografía","definition":"1. Imagen obtenida por medio de la fotografía.\n2. Procedimiento o técnica que permite obtener imágenes fijas de la realidad mediante la acción directa o indirecta de la luz sobre un soporte fotosensible: papel, placas o películas recubiertas previamente de sustancias sensibles a la misma.","video":"https://panel.f
