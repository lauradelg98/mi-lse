to.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/punto.png"},{"word":"Página","entry":"página","definition":"1. Cada una de las dos haces o planas de la hoja de un libro o cuaderno.\n2. Lo escrito o impreso en cada página.","video":"https://panel.fundacioncnse-dilse.org/storage/pagina.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pagina.png"},{"word":"Pájaro/a","entry":"pájaro, ra","definition":"Ave, especialmente si es pequeña.","video":"https://panel.fundacioncnse-dilse.org/storage/pajaro.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pajaro.png"},{"word":"Querer (amar)","entry":"querer (#querer bien alguien a otra persona)","definition":"Amarla.","video":"https://panel.fundacioncnse-dilse.org/storage/querer-amar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/querer-amar.png"},{"word":"Querer (desear)","entry":"querer","definition":"1. Desear o apetecer.\n2. Tener voluntad o determinación de ejecutar algo.","video":"https://panel.fundacioncnse-dilse.org/storage/querer-desear.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/querer-desear.png"},{"word":"Queso","entry":"queso","definition":"Producto obtenido por maduración de la cuajada de la leche con características propias para cada uno de los tipos según su origen o método de fabricación.","video":"https://panel.fundacioncnse-dilse.org/storage/queso.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/queso.png"},{"word":"Quieto/a","entry":"quieto, ta","definition":"Que no tiene o no hace movimiento.","video":"https://panel.fundacioncnse-dilse.org/storage/quieto.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/quieto.png"},{"word":"Receta","entry":"receta","definition":"1. Prescripción facultativa.\n2. Nota escrita de una receta.","video":"https://panel.fundacioncnse-dilse.org/storage/receta-medica.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/receta-medica.png"},{"word":"Región de Murcia","entry":"región (#Región de Murcia)","definition":"Comunidad autónoma que está localizada en la parte sudeste de España, formada por una única provincia y cuya capital es Murcia.","video":"https://panel.fundacioncnse-dilse.org/storage/region-murcia.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/region-murcia.png"},{"word":"Regular","entry":"regular","definition":"Determinar las reglas o normas a que debe ajustarse alguien o algo.","video":"https://panel.fundacioncnse-dilse.org/storage/regular-regla.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/regular-regla.png"},{"word":"Reina","entry":"reina","definition":"1. Monarca soberana de un reino.\n2. Persona que por matrimonio tiene dignidad de reina.","video":"https://panel.fundacioncnse-dilse.org/storage/reina.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/reina.png"},{"word":"Religión","entry":"religión","definition":"Conjunto de creencias o dogmas acerca de la divinidad, de sentimientos de veneración y temor hacia ella, de normas morales para la conducta individual y social y de prácticas rituales, principalmente la oración y el sacrificio para darle culto.","video":"https://panel.fundacioncnse-dilse.org/storage/religion.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/religion.png"},{"word":"Reloj (de pulsera)","entry":"reloj","definition":"Instrumento que sirve para medir el tiempo.","video":"https://panel.fundacioncnse-dilse.org/storage/reloj.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/reloj.png"},{"word":"Repasar/Repaso","entry":"repaso","definition":"1. Acción y efecto de repasar.\n2. Estudio ligero que se hace de lo que se tiene visto o estudiado, para mayor comprensión y firmeza en la memoria.","video":"https://panel.fundacioncnse-dilse.org/storage/repaso.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/repaso.png"},{"word":"Reservar (hacer una reserva)","entry":"reservar","definition":"Destinar un lugar o una cosa, de un modo exclusivo, para uso o persona determinados.","video":"https://panel.fundacioncnse-dilse.org/storage/reservar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/reservar.png"},{"word":"Restaurante","entry":"restaurante","definition":"Establecimiento público donde se sirven comidas y bebidas, mediante precio, para ser consumidas en el mismo local.","video":"https://panel.fundacioncnse-dilse.org/storage/restaurante.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/restaurante.png"},{"word":"Retrete","entry":"retrete","definition":"Aposento dotado de las instalaciones necesarias para orinar y evacuar el vientre.","video":"https://panel.fundacioncnse-dilse.org/storage/retrete.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/retrete.png"},{"word":"Revista","entry":"revista","definition":"Publicación periódica con textos e imágenes sobre varias materias, o sobre una especialmente.","video":"https://panel.fundacioncnse-dilse.org/storage/revista.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/revista.png"},{"word":"Rey","entry":"rey","definition":"1. Monarca soberano de un reino.\n2. Persona que por matrimonio tiene dignidad de rey.","video":"https://panel.fundacioncnse-dilse.org/storage/rey.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/rey.png"},{"word":"Rico/a (sabor)","entry":"rico, ca","definition":"Gustoso, sabroso, agradable.","video":"https://panel.fundacioncnse-dilse.org/storage/rico-sabor.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/rico-sabor.png"},{"word":"Rojo","entry":"rojo, ja","definition":"1. Dicho de un color: Semejante al de la sangre o al del tomate maduro.\n2. De color rojo.","video":"https://panel.fundacioncnse-dilse.org/storage/rojo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/rojo.png"},{"word":"Ropa","entry":"ropa","definition":"Prenda de vestir.","video":"https://panel.fundacioncnse-dilse.org/storage/ropa.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/ropa.png"},{"word":"Rosa (color)","entry":"rosa","definition":"1. Flor del rosal, notable por su belleza, la suavidad de su fragancia y su color. Suele llevar el mismo calificativo de la planta que la produce.\n2. Objeto cuya forma recuerda la de la rosa.","video":"https://panel.fundacioncnse-dilse.org/storage/rosa-flor.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/rosa-flor.png"},{"word":"Rubio/a","entry":"rubio, bia","definition":"1. Dicho especialmente del pelo: De color rubio.\n2. De tabaco rubio.\n3. Dicho de una persona: Que tiene el pelo rubio.","video":"https://panel.fundacioncnse-dilse.org/storage/rubio.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/rubio.png"},{"word":"Ruido","entry":"ruido","definition":"Sonido inarticulado, por lo general desagradable.","video":"https://panel.fundacioncnse-dilse.org/storage/ruido.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/ruido.png"},{"word":"Rusia","entry":"Rusia","definition":"País que está localizado en la parte este de Europa.","video":"https://panel.fundacioncnse-dilse.org/storage/rusia.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/rusia.png"},{"word":"Río","entry":"río","definition":"Corriente de agua continua y más o menos caudalosa que va a desembocar en otra, en un lago o en el mar.","video":"https://panel.fundacioncnse-dilse.org/storage/rio.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/rio.png"},{"word":"Saber (conocimiento)","entry":"saber","definition":"1. Tener noticia o conocimiento de algo.\n2. Estar instruido en algo.","video":"https://panel.fundacioncnse-dilse.org/storage/saber.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/saber.png"},{"word":"Sal","entry":"sal","definition":"Sustancia, consistente en cloruro sódico, ordinariamente blanca, cristalina, de sabor propio, muy soluble en agua, que se emplea para sazonar y conservar alimentos, es muy abundante en las aguas del mar y también se encuentra en la corteza terrestre.","video":"https://panel.fundacioncnse-dilse.org/storage/sal.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/sal.png"},{"word":"Salamanca","entry":"Salamanca","definition":"1. Ciudad española que está localizada en la parte oeste y central del pais.\n2. Provincia de la comunidad autónoma de Castilla y León.\n3. Capital de la provincia que lleva el mismo nombre.","video":"https://panel.fundacioncnse-dilse.org/storage/salamanca.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/salamanca.png"},{"word":"Salud","entry":"salud","definition":"1. Estado en que el ser orgánico ejerce normalmente todas sus funciones.\n2. Conjunto de las condiciones físicas en que se encuentra un organismo en un momento determinado.","video":"https://panel.fundacioncnse-dilse.org/storage/salud.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/salud.png"},{"word":"Salón","entry":"salón","definition":"En una casa, habitación principal en que se suele recibir a las visitas y que generalmente sirve de comedor y cuarto de estar.","video":"https://panel.fundacioncnse-dilse.org/storage/salon.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/salon.png"},{"word":"San Sebastián","entry":"San Sebastián","definition":"1. Ciudad española que está localizada en la parte norte y central del país.\n2. Capital de la provincia de Guipúzcoa de la comunidad autónoma del País Vasco.","video":"https://panel.fundacioncnse-dilse.org/storage/san-sebastian.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/san-sebastian.png"},{"word":"Santa Cruz de Tenerife","entry":"Santa Cruz de Tenerife","definition":"1. Ciudad española que está localizada en el noroeste de la isla de Tenerife.\n2. Capital de la Isla de Tenerife.\n3. Provincia de la comunidad autónoma de las Islas Canarias.\n4. Capital de la provincia que lleva el mismo nombre.\n5. Una de las capitales de la comunidad autónoma de Canarias.","video":"https://panel.fundacioncnse-dilse.org/storage/santa-cruz-de-tenerife.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/santa-cruz-de-tenerife.png"},{"word":"Santander","entry":"Santander","definition":"1. Ciudad española que está localizada en la parte norte y central del país.\n2. Capital de la comunidad autónoma de Cantabria.","video":"https://panel.fundacioncnse-dilse.org/storage/santander.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/santander.png"},{"word":"Sartén","entry":"sartén","definition":"Recipiente de cocina, generalmente de metal, de forma circular, poco hondo y con mango largo, que sirve sobre todo para freír.","video":"https://panel.fundacioncnse-dilse.org/storage/sarten.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/sarten.png"},{"word":"Sed","entry":"sed","definition":"Gana y necesidad de beber.","video":"https://panel.fundacioncnse-dilse.org/storage/sed.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/sed.png"},{"word":"Segovia","entry":"Segovia","definition":"1. Ciudad española que está localizada en la parte central del país.\n2. Provincia de la comunidad autónoma de Castilla y león.\n3. Capital de la provincia que lleva el mismo nombre.","video":"https://panel.fundacioncnse-dilse.org/storage/segovia.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/segovia.png"},{"word":"Segundo (tiempo)","entry":"segundo, da","definition":"Unidad de tiempo del sistema internacional, que equivale a una de las sesenta partes iguales en que se divide el minuto.","video":"https://panel.fundacioncnse-dilse.org/storage/segundo-tiempo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/segundo-tiempo.png"},{"word":"Seguridad Social","entry":"seguridad (#seguridad social)","definition":"Sistema público de prestaciones de carácter económico o asistencial, que atiende necesidades determinadas de la población, como las derivadas de la enfermedad, el desempleo, la ancianidad, etc.","video":"https://panel.fundacioncnse-dilse.org/storage/seguridad_social.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/seguridad_social.png"},{"word":"Seguro (cobertura de daños)","entry":"seguro, ra","definition":"Contrato por el que alguien se obliga mediante el cobro de una prima a indemnizar el daño producido a otra persona, o a satisfacerle un capital, una renta u otras prestaciones convenidas.","video":"https://panel.fundacioncnse-dilse.org/storage/seguro-contrato.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/seguro-contrato.png"},{"word":"Seguro/a (seguridad)","entry":"seguro, ra","definition":"1. Que no falla o que ofrece confianza.\n2. Dicho de una persona: Que no siente duda.\n3. De manera segura o que se da por segura.","video":"https://panel.fundacioncnse-dilse.org/storage/seguro-estar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/seguro-estar.png"},{"word":"Sello","entry":"sello","definition":"Sello de papel que se adhiere a un envío postal para franquearlo o certificarlo.","video":"https://panel.fundacioncnse-dilse.org/storage/sello-carta.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/sello-carta.png"},{"word":"Semana","entry":"semana","definition":"1. Serie de siete días naturales consecutivos, del lunes al domingo.\n2. Período de siete días consecutivos.","video":"https://panel.fundacioncnse-dilse.org/storage/semana.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/semana.png"},{"word":"Semana Santa","entry":"semana (#Semana Mayor, o Semana Santa)","definition":"Libro en que está el rezo propio del tiempo de la Semana Santa, y los oficios que se celebran en ella.","video":"https://panel.fundacioncnse-dilse.org/storage/semana_santa.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/semana_santa.png"},{"word":"Sentarse","entry":"sentar","definition":"Poner o colocar a alguien en una silla, banco, etc., de manera que quede apoyado y descansando sobre las nalgas.","video":"https://panel.fundacioncnse-dilse.org/storage/sentar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/sentar.png"},{"word":"Separado/a (cónyuge)","entry":"separado, da","definition":"Dicho de una persona: Que ha interrumpido la vida en común con su cónyuge, conservando el vínculo matrimonial.","video":"https://panel.fundacioncnse-dilse.org/storage/separado.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/separado.png"},{"word":"Septiembre","entry":"septiembre","definition":"Noveno mes del año, que tiene 30 días.","video":"https://panel.fundacioncnse-dilse.org/storage/septiembre.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/septiembre.png"},{"word":"Serio/a","entry":"serio, ria","definition":"1. Dicho de persona: Que no ríe, o no manifiesta alegría en sus gestos o comportamientos.\n2. Dicho de una acción: Propia de una persona seria.\n3. Dicho de una persona: Que actúa con responsabilidad y tomando en consideración aquello que importa.","video":"https://panel.fundacioncnse-dilse.org/storage/serio.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/serio.png"},{"word":"Sevilla","entry":"Sevilla","definition":"1. Ciudad española que está localizada en la parte suroeste del país.\n2. Provincia de la comunidad autónoma de Andalucía.\n3. Capital de la provincia que lleva el mismo nombre.","video":"https://panel.fundacioncnse-dilse.org/storage/sevilla.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/sevilla.png"},{"word":"Si (Condicional)","entry":"si","definition":"Denota condición o suposición en virtud de la cual un concepto depende de otro u otros.","video":"https://panel.fundacioncnse-dilse.org/storage/si-condicional.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/si-condicional.png"},{"word":"Siempre","entry":"siempre","definition":"En todo o en cualquier tiempo.","video":"https://panel.fundacioncnse-dilse.org/storage/siempre.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/siempre.png"},{"word":"Signar","entry":"signar","definition":"Comunicar o expresar algo mediante lengua de signos o de señas.","video":"https://panel.fundacioncnse-dilse.org/storage/signar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/signar.png"},{"word":"Signo","entry":"signo","definition":"Señal o figura que se usa en los cálculos para indicar la naturaleza de las cantidades y las operaciones que se han de ejecutar con ellas.","video":"https://panel.fundacioncnse-dilse.org/storage/signo-matematicas.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/signo-matematicas.png"},{"word":"Silla","entry":"silla","definition":"Asiento con respaldo, por lo general con cuatro patas, y en que solo cabe una persona.","video":"https://panel.fundacioncnse-dilse.org/storage/silla.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/silla.png"},{"word":"Simpático/a","entry":"simpático, ca","definition":"Que inspira simpatía.","video":"https://panel.fundacioncnse-dilse.org/storage/simpatico.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/simpatico.png"},{"word":"Sin","entry":"sin","definition":"Denota carencia o falta de algo.","video":"https://panel.fundacioncnse-dilse.org/storage/sin.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/sin.png"},{"word":"Sobre","entry":"sobre","definition":"Encima de.","video":"https://panel.fundacioncnse-dilse.org/storage/sobre-encima.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/sobre-encima.png"},{"word":"Sobre (tema)","entry":"sobre","definition":"Sobre aquello de que se trata, en orden a ello.","video":"https://panel.fundacioncnse-dilse.org/storage/sobre-tema.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/sobre-tema.png"},{"word":"Sobrino/a","entry":"sobrino, na","definition":"Respecto de una persona, hijo o hija de su hermano o hermana.","video":"https://panel.fundacioncnse-dilse.org/storage/sobrino.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/sobrino.png"},{"word":"Sofá","entry":"sofá","definition":"Asiento cómodo para dos o más personas, que tiene respaldo y brazos.","video":"https://panel.fundacioncnse-dilse.org/storage/sofa.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/sofa.png"},{"word":"Sol","entry":"sol","definition":"Estrella luminosa, centro de nuestro sistema planetario.","video":"https://panel.fundacioncnse-dilse.org/storage/sol.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/sol.png"},{"word":"Soltero/a","entry":"soltero, ra","definition":"Que no se ha casado.","video":"https://panel.fundacioncnse-dilse.org/storage/soltero.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/soltero.png"},{"word":"Sopa","entry":"sopa","definition":"Plato compuesto de un caldo y uno o más ingredientes sólidos cocidos en él.","video":"https://panel.fundacioncnse-dilse.org/storage/sopa.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/sopa.png"},{"word":"Sordo/a","entry":"sordo, da","definition":"Que padece una pérdida auditiva en mayor o menor grado.","video":"https://panel.fundacioncnse-dilse.org/storage/sordo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/sordo.png"},{"word":"Soria","entry":"Soria","definition":"1. Ciudad española que está localizada en la parte central del país.\n2. Provincia de la comunidad autónoma de Castilla y León.\n3. Capital de la provincia lleva el mismo nombre.","video":"https://panel.fundacioncnse-dilse.org/storage/soria.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/soria.png"},{"word":"Soso/a","entry":"soso, sa","definition":"Que no tiene sal, o tiene poca.","video":"https://panel.fundacioncnse-dilse.org/storage/soso-sabor.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/soso-sabor.png"},{"word":"Su","entry":"su","definition":"De él o de ella, de ellos o de ellas.","video":"https://panel.fundacioncnse-dilse.org/storage/su.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/su.png"},{"word":"Sucio/a","entry":"sucio, cia","definition":"Que tiene manchas, polvo, grasa o cosas semejantes que hacen que su aspecto sea poco agradable.","video":"https://panel.fundacioncnse-dilse.org/storage/sucio.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/sucio.png"},{"word":"Suegra","entry":"suegra","definition":"Madre del cónyuge de una persona.","video":"https://panel.fundacioncnse-dilse.org/storage/suegra.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/suegra.png"},{"word":"Suegro","entry":"suegro","definition":"Padre del cónyuge de una persona.","video":"https://panel.fundacioncnse-dilse.org/storage/suegro.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/suegro.png"},{"word":"Suelo","entry":"suelo","definition":"1. Superficie terrestre.\n2. Piso (superficie horizontal de un edificio).","video":"https://panel.fundacioncnse-dilse.org/storage/suelo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/suelo.png"},{"word":"Suerte (deseo)","entry":"suerte (#¡suerte!)","definition":"Para desearle a una persona que le suceda algo favorable.","video":"https://panel.fundacioncnse-dilse.org/storage/suerte-desear.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/suerte-desear.png"},{"word":"Suerte / Tener suerte","entry":"suerte","definition":"Circunstancia de ser, por mera casualidad, favorable a alguien o algo lo que ocurre o sucede.","video":"https://panel.fundacioncnse-dilse.org/storage/suerte.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/suerte.png"},{"word":"Sueño (dormir)","entry":"sueño","definition":"Gana de dormir.","video":"https://panel.fundacioncnse-dilse.org/storage/sueno-dormir.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/sueno-dormir.png"},{"word":"Sujetador","entry":"sujetador","definition":"Sostén (prenda interior femenina).","video":"https://panel.fundacioncnse-dilse.org/storage/sujetador.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/sujetador.png"},{"word":"Sur","entry":"sur","definition":"1. Punto cardinal situado a la espalda de un observador a cuya derecha está el este.\n2. Región o territorio situado en la parte sur de un país o de un área geográfica determinada.\n3. Lugar situado al sur de otro lugar con cuya posición se compara.","video":"https://panel.fundacioncnse-dilse.org/storage/sur.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/sur.png"},{"word":"Suspender (no aprobar)","entry":"suspender","definition":"Detener o diferir por algún tiempo una acción u obra.","video":"https://panel.fundacioncnse-dilse.org/storage/suspender_a.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/suspender_a.png"},{"word":"Suyo/a","entry":"suyo, ya","definition":"Para indicar que una tercera persona (o personas) posee aquello de lo que se habla, signa o escribe.","video":"https://panel.fundacioncnse-dilse.org/storage/suyo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/suyo.png"},{"word":"Sábana","entry":"sábana","definition":"Cada una de las dos piezas de lienzo, algodón u otro tejido, de tamaño suficiente para cubrir la cama y colocar el cuerpo entre ambas.","video":"https://panel.fundacioncnse-dilse.org/storage/sabana.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/sabana.png"},{"word":"Sándwich","entry":"sándwich","definition":"Emparedado hecho con dos rebanadas de pan de molde entre las que se coloca jamón, queso, embutido, vegetales u otros alimentos.","video":"https://panel.fundacioncnse-dilse.org/storage/sandwich.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/sandwich.png"},{"word":"Taller","entry":"taller","definition":"1. Lugar en que se trabaja una obra de manos.\n2. Escuela o seminario de ciencias o de artes.","video":"https://panel.fundacioncnse-dilse.org/storage/taller.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/taller.png"},{"word":"Tarde (periodo del día)","entry":"tarde","definition":"Parte del día comprendida entre el mediodía y el anochecer.","video":"https://panel.fundacioncnse-dilse.org/storage/tarde_a.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/tarde_a.png"},{"word":"Tarde (retraso)","entry":"tarde","definition":"Parte del día comprendida entre el mediodía y el anochecer.","video":"https://panel.fundacioncnse-dilse.org/storage/tarde_a.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/tarde_a.png"},{"word":"Tarjeta (de débito o crédito)","entry":"tarjeta","definition":"Pieza de cartulina u otro material, generalmente rectangular y de pequeño tamaño, usada para escribir o imprimir algo.","video":"https://panel.fundacioncnse-dilse.org/storage/tarjeta.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/tarjeta.png"},{"word":"Taxi","entry":"taxi","definition":"Automóvil de alquiler con conductor, generalmente provisto de taxímetro.","video":"https://panel.fundacioncnse-dilse.org/storage/taxi.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/taxi.png"},{"word":"Taza","entry":"taza","definition":"Vasija pequeña, por lo común de loza o de metal y con asa, empleada generalmente para tomar líquidos.","video":"https://panel.fundacioncnse-dilse.org/storage/taza.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/taza.png"},{"word":"Teatro","entry":"teatro","definition":"1. Edificio o sitio destinado a la representación de obras dramáticas o a otros espectáculos públicos propios de la escena.\n2. Arte de componer obras dramáticas, o de representarlas.","video":"https://panel.fundacioncnse-dilse.org/storage/teatro.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/teatro.png"},{"word":"Techo","entry":"techo","definition":"Parte superior de un edificio, construcción, habitáculo, etc., que lo cubre y cierra.","video":"https://panel.fundacioncnse-dilse.org/storage/techo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/techo.png"},{"word":"Tela","entry":"tela","definition":"Obra, especialmente la tejida en el telar, hecha de muchos hilos, que, entrecruzados alternativa y regularmente en toda su longitud, forman como una lámina.","video":"https://panel.fundacioncnse-dilse.org/storage/tela.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/tela.png"},{"word":"Televisión","entry":"televisión","definition":"1. Sistema de transmisión de imágenes a distancia, que en la emisora se transforman en ondas electromagnéticas y se recuperan en el aparato receptor.\n2. Aparato receptor de televisión.\n3. Emisora de televisión.","video":"https://panel.fundacioncnse-dilse.org/storage/television.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/television.png"},{"word":"Teléfono","entry":"teléfono","definition":"1. Conjunto de aparatos e hilos conductores con los cuales se transmite a distancia la palabra y toda clase de sonidos por la acción de la electricidad.\n2. Aparato para hablar por teléfono.","video":"https://panel.fundacioncnse-dilse.org/storage/telefono.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/telefono.png"},{"word":"Tema","entry":"tema","definition":"1. Proposición o texto que se toma por asunto o materia de un discurso.\n2. Cada una de las unidades de contenido en que se divide un programa de estudios o de una oposición, o un libro de texto.","video":"https://panel.fundacioncnse-dilse.org/storage/tema.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/tema.png"},{"word":"Temporada","entry":"temporada","definition":"1. Espacio de varios días, meses o años que se consideran aparte formando un conjunto.\n2. Tiempo durante el cual se realiza habitualmente algo.","video":"https://panel.fundacioncnse-dilse.org/storage/temporada.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/temporada.png"},{"word":"Temprano/Pronto","entry":"temprano, na","definition":"1. Adelantado, anticipado o que es antes del tiempo regular u ordinario.\n2. En las primeras horas del día o de la noche y, por extensión, al principio de un período determinado de tiempo.\n3. En tiempo anterior al oportuno, convenido o acostumbrado para algún fin, o muy pronto.","video":"https://panel.fundacioncnse-dilse.org/storage/temprano.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/temprano.png"},{"word":"Tenedor","entry":"tenedor","definition":"Instrumento de mesa en forma de horca, con dos o más púas y que sirve para comer alimentos sólidos.","video":"https://panel.fundacioncnse-dilse.org/storage/tenedor.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/tenedor.png"},{"word":"Tenis","entry":"tenis","definition":"Juego entre dos personas o dos parejas, en que los jugadores, a ambos lados de la red, se lanzan con raquetas una pelota con el propósito de que la otra parte no acierte a devolverla.","video":"https://panel.fundacioncnse-dilse.org/storage/tenis.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/tenis.png"},{"word":"Terraza","entry":"terraza","definition":"1. Sitio abierto de una casa desde el cual se puede explayar la vista.\n2. Terreno situado delante de un café, bar, restaurante, etc., acotado para que los clientes puedan sentarse al aire libre.\n3. Cubierta plana y practicable de un edificio, provista de barandas o muros.","video":"https://panel.fundacioncnse-dilse.org/storage/terraza.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/terraza.png"},{"word":"Teruel","entry":"Teruel","definition":"1. Ciudad española que está localizada en la parte central y este del país.\n2. Provincia de la comunidad autónoma de Aragón.\n3. Capital de la provincia que lleva el mismo nombre.","video":"https://panel.fundacioncnse-dilse.org/storage/teruel.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/teruel.png"},{"word":"Tienda","entry":"tienda","definition":"Estructura de tubos o palos cubiertos con lonas o pieles, que sirve de alojamiento en un espacio abierto.","video":"https://panel.fundacioncnse-dilse.org/storage/tienda-camping.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/tienda-camping.png"},{"word":"Timido/a","entry":"tímido, da","definition":"Dicho de persona: Que actúa con miedo o indecisión, especialmente en el trato con los demás.","video":"https://panel.fundacioncnse-dilse.org/storage/timido.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/timido.png"},{"word":"Toalla","entry":"toalla","definition":"Pieza de felpa, algodón u otro material, por lo general rectangular, para secarse el cuerpo.","video":"https://panel.fundacioncnse-dilse.org/storage/toalla.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/toalla.png"},{"word":"Todo (relacionado con salud)","entry":"todo, da","definition":"Enteramente o por completo en cuanto a la salud, ropa, higiene, etc., de una persona.","video":"https://panel.fundacioncnse-dilse.org/storage/todo-cuerpo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/todo-cuerpo.png"},{"word":"Todo/Toda/Todos/Todas","entry":"todo, da","definition":"1. Designa la totalidad de los miembros de un conjunto.\n2. Todas las personas.\n3. Todas las cosas.\n4. Enteramente o por completo.","video":"https://panel.fundacioncnse-dilse.org/storage/todo_mp.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/todo_mp.png"},{"word":"Todos los días","entry":"día (#todos los días)","definition":"Para expresar que algo se realiza con continuidad.","video":"https://panel.fundacioncnse-dilse.org/storage/dias_todos_los.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/dias_todos_los.png"},{"word":"Toledo","entry":"Toledo","definition":"1. Ciudad española que está localizada en la parte central del país.\n2. Provincia de la comunidad autónoma de Castilla-La Mancha.\n3. Capital de la provincia que lleva el mismo nombre.","video":"https://panel.fundacioncnse-dilse.org/storage/toledo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/toledo.png"},{"word":"Tomate","entry":"tomate","definition":"Baya roja, fruto de la tomatera, de superficie lisa y brillante, en cuya pulpa hay numerosas semillas algo aplastadas y amarillas.","video":"https://panel.fundacioncnse-dilse.org/storage/tomate.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/tomate.png"},{"word":"Torpe","entry":"torpe","definition":"1. Que se mueve con dificultad.\n2. Rudo, tardo en comprender.","video":"https://panel.fundacioncnse-dilse.org/storage/torpe_mon.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/torpe_mon.png"},{"word":"Tortilla española","entry":"tortilla (#tortilla española)","definition":"Tortilla en la que se cuajan huevos con patatas previamente fritas.","video":"https://panel.fundacioncnse-dilse.org/storage/tortilla_espanola.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/tortilla_espanola.png"},{"word":"Tortilla francesa","entry":"tortilla (#tortilla francesa)","definition":"Tortilla hecha solo con huevo.","video":"https://panel.fundacioncnse-dilse.org/storage/tortilla_francesa.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/tortilla_francesa.png"},{"word":"Tos/Toser","entry":"toser","definition":"1. Tener o padecer tos.\n2. Hacer fuerza y violencia con la respiración, para arrancar del pecho lo que le fatiga y molesta.","video":"https://panel.fundacioncnse-dilse.org/storage/toser.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/toser.png"},{"word":"Trabajar","entry":"trabajar","definition":"1. Ocuparse en cualquier actividad física o intelectual.\n2. Tener una ocupación remunerada en una empresa, una institución, etc.\n3. Ejercer determinada profesión u oficio.","video":"https://panel.fundacioncnse-dilse.org/storage/trabajar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/trabajar.png"},{"word":"Traje (de hombre)","entry":"traje","definition":"Conjunto de chaqueta, pantalón y, a veces, chaleco, hechos de la misma tela.","video":"https://panel.fundacioncnse-dilse.org/storage/traje.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/traje.png"},{"word":"Tranquilo/a","entry":"tranquilo, la","definition":"1. Quieto, sosegado, pacífico.\n2. Dicho de una persona: Que se toma las cosas con tiempo, sin nerviosismos ni agobios, y que no se preocupa por quedar bien o mal ante la opinión os médicos inmediatos.","video":"https://panel.fundacioncnse-dilse.org/storage/urgencia.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/urgencia.png"},{"word":"Valencia","entry":"Valencia","definition":"1. Ciudad española que está localizada en la parte central y oeste del país.\n2. Provincia de la Comunidad Valenciana.\n3. Capital de la provincia que lleva el mismo nombre.\n4. Capital de la Comunidad Valenciana.","video":"https://panel.fundacioncnse-dilse.org/storage/valencia.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/valencia.png"},{"word":"Valladolid","entry":"Valladolid","definition":"1. Ciudad española que está localizada en la parte central y noroeste del país.\n2. Provincia de la comunidad autónoma de Castilla y León.\n3. Capital de la provincia que lleva el mismo nombre.","video":"https://panel.fundacioncnse-dilse.org/storage/valladolid.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/valladolid.png"},{"word":"Vaso","entry":"vaso","definition":"Recipiente de vidrio, metal u otra materia, por lo común de forma cilíndrica, que sirve para beber.","video":"https://panel.fundacioncnse-dilse.org/storage/vaso.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/vaso.png"},{"word":"Vecino/a","entry":"vecino, na","definition":"Que habita con otros en un mismo pueblo, barrio o casa, en vivienda independiente.","video":"https://panel.fundacioncnse-dilse.org/storage/vecino.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/vecino.png"},{"word":"Venir","entry":"venir","definition":"1. Dicho de una cosa: Moverse de allá hacia acá.\n2. Dicho de una persona o de una cosa: Llegar a donde está quien habla.","video":"https://panel.fundacioncnse-dilse.org/storage/venir.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/venir.png"},{"word":"Venta/Vender","entry":"vender","definition":"1. Traspasar a alguien por el precio convenido la propiedad de lo que se posee.\n2. Exponer u ofrecer al público los géneros o mercancías para quien las quiera comprar.","video":"https://panel.fundacioncnse-dilse.org/storage/vender.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/vender.png"},{"word":"Ventana","entry":"ventana","definition":"Abertura en un muro o pared donde se coloca un elemento y que sirve generalmente para mirar y dar luz y ventilación.","video":"https://panel.fundacioncnse-dilse.org/storage/ventana.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/ventana.png"},{"word":"Ver","entry":"ver","definition":"1. Percibir con los ojos algo mediante la acción de la luz.\n2. Percibir con la inteligencia algo, comprenderlo.\n3. Comprobar algo con algún sentido.\n4. Conjeturar o deducir un hecho del futuro por algún indicio.\n5. Considerar que algo o alguien es o está de una determinada manera.\n6. En una disertación o un texto, tratar, analizar, considerar algo.\n7. Visitar a una persona.","video":"https://panel.fundacioncnse-dilse.org/storage/ver_aa.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/ver_aa.png"},{"word":"Verano","entry":"verano","definition":"1. Estación del año que, astronómicamente, comienza en el solsticio del mismo nombre y termina en el equinoccio de otoño.\n2. Época más calurosa del año, que en el hemisferio boreal corresponde a los meses de junio, julio y agosto, y en el austral a los de diciembre, enero y febrero.","video":"https://panel.fundacioncnse-dilse.org/storage/verano.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/verano.png"},{"word":"Verde","entry":"verde","definition":"1. Dicho de un color: Semejante al de la hierba fresca o al de la esmeralda.\n2. De color verde.","video":"https://panel.fundacioncnse-dilse.org/storage/verde.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/verde.png"},{"word":"Verdura","entry":"verdura","definition":"Hortaliza, especialmente la de hojas verdes.","video":"https://panel.fundacioncnse-dilse.org/storage/verdura.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/verdura.png"},{"word":"Viejo/a","entry":"viejo, ja","definition":"1. Dicho de un ser vivo: De edad avanzada.\n2. Deslucido, estropeado por el uso.\n3. Que no es reciente ni nuevo.","video":"https://panel.fundacioncnse-dilse.org/storage/viejo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/viejo.png"},{"word":"Viernes","entry":"viernes","definition":"Quinto día de la semana, que es festivo para el islamismo.","video":"https://panel.fundacioncnse-dilse.org/storage/viernes.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/viernes.png"},{"word":"Vino Blanco","entry":"vino (#vino blanco)","definition":"Bebida alcohólica de color dorado que se hace del zumo de las uvas blancas exprimido, y cocido naturalmente por la fermentación.","video":"https://panel.fundacioncnse-dilse.org/storage/vino-blanco.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/vino-blanco.png"},{"word":"Vino tinto","entry":"vino (#vino tinto)","definition":"Bebida alcohólica de color rojo oscuro que se hace del zumo de las uvas negras exprimido, y cocido naturalmente por la fermentación.","video":"https://panel.fundacioncnse-dilse.org/storage/vino-tinto.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/vino-tinto.png"},{"word":"Visitar","entry":"visitar","definition":"Ir a ver a alguien en el lugar en que se halla.","video":"https://panel.fundacioncnse-dilse.org/storage/visitar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/visitar.png"},{"word":"Viudo/a","entry":"viudo, da","definition":"Dicho de una persona: Que ha perdido a su cónyuge por haber muerto este y no ha vuelto a casarse.","video":"https://panel.fundacioncnse-dilse.org/storage/viudo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/viudo.png"},{"word":"Vivir","entry":"vivir","definition":"1. Tener vida.\n2. Pasar y mantener la vida.\n3. Habitar o morar en un lugar o país.","video":"https://panel.fundacioncnse-dilse.org/storage/vivir.mov","photo":"https://panel.fundacioncns
