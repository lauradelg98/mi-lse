lleta.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/galleta.png"},{"word":"Garganta","entry":"garganta","definition":"1. Parte anterior del cuello.\n2. Espacio interno comprendido entre el velo del paladar y la entrada del esófago y de la laringe.","video":"https://panel.fundacioncnse-dilse.org/storage/garganta.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/garganta.png"},{"word":"Gel","entry":"gel","definition":"Jabón o producto cosmético semilíquidos.","video":"https://panel.fundacioncnse-dilse.org/storage/gel.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/gel.png"},{"word":"Generoso/a","entry":"generoso, sa","definition":"1. Dicho de persona: Que da lo que tiene desinteresadamente.\n2. Dicho de persona: Que se sacrifica desinteresadamente por los demás.","video":"https://panel.fundacioncnse-dilse.org/storage/generoso.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/generoso.png"},{"word":"Gorra","entry":"gorra","definition":"Prenda para cubrir la cabeza, especialmente la de tela, piel o punto con visera.","video":"https://panel.fundacioncnse-dilse.org/storage/gorra.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/gorra.png"},{"word":"Gorro","entry":"gorro","definition":"Pieza redonda, de tela o de punto, para cubrir y abrigar la cabeza.","video":"https://panel.fundacioncnse-dilse.org/storage/gorro.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/gorro.png"},{"word":"Grande","entry":"grande","definition":"Dicho de una persona: Adulta (llegada a la plenitud de crecimiento).","video":"https://panel.fundacioncnse-dilse.org/storage/grande-adulto.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/grande-adulto.png"},{"word":"Gripe","entry":"gripe","definition":"Enfermedad epidémica aguda, acompañada de fiebre y con manifestaciones variadas, especialmente catarrales.","video":"https://panel.fundacioncnse-dilse.org/storage/gripe.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/gripe.png"},{"word":"Gris","entry":"gris","definition":"1. Dicho de un color: Semejante al de la ceniza o el acero, y que resulta de mezclar el blanco y el negro.\n2. De color gris.","video":"https://panel.fundacioncnse-dilse.org/storage/gris-color.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/gris-color.png"},{"word":"Guadalajara","entry":"Guadalajara","definition":"1. Ciudad española que está localizada en la parte central de España.\n2. Provincia de la comunidad autónoma de Castilla-La Mancha.\n3. Capital de la provincia que lleva el mismo nombre.","video":"https://panel.fundacioncnse-dilse.org/storage/guadalajara.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/guadalajara.png"},{"word":"Guapo/a","entry":"guapo, pa","definition":"1. Bien parecido.\n2. Acicalado, bien vestido.","video":"https://panel.fundacioncnse-dilse.org/storage/guapo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/guapo.png"},{"word":"Guerra","entry":"guerra","definition":"Lucha armada entre dos o más naciones o entre bandos de una misma nación.","video":"https://panel.fundacioncnse-dilse.org/storage/guerra.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/guerra.png"},{"word":"Guipúzcoa","entry":"Guipúzcoa","definition":"Provincia del País Vasco que está localizada en la parte norte y central de España.","video":"https://panel.fundacioncnse-dilse.org/storage/guipuzcoa.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/guipuzcoa.png"},{"word":"Guión (signo ortográfico)","entry":"guion","definition":"Signo ortográfico (-) que se usa para dividir, al final del renglón, una palabra que no cabe completa en él. Se usa también para unir palabras a fin de formar compuestos, para expresar relación entre conceptos o entidades, para expresar intervalos, para unir prefijos a siglas o nombres propios y para unir expresiones que combinan cifras y letras.","video":"https://panel.fundacioncnse-dilse.org/storage/guion-ortografia.mov","photo":"https://pane n que ha llegado a la edad adulta.","video":"https://panel.fundacioncnse-dilse.org/storage/hombre.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/hombre.png"},{"word":"Hora","entry":"hora","definition":"1. Tiempo que equivale a 60 minutos, es decir, 3600 segundos.\n2. Tiempo oportuno y determinado para algo.","video":"https://panel.fundacioncnse-dilse.org/storage/hora.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/hora.png"},{"word":"Horario","entry":"horario","definition":"1. Cuadro indicador de las horas en que deben ejecutarse determinadas actividades.\n2. Tiempo durante el cual se desarrolla habitual o regularmente una acción o se realiza una actividad.","video":"https://panel.fundacioncnse-dilse.org/storage/horario.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/horario.png"},{"word":"Hospital","entry":"hospital","definition":"Establecimiento destinado al diagnóstico y tratamiento de enfermos, donde a menudo se practican la investigación y la docencia.","video":"https://panel.fundacioncnse-dilse.org/storage/hospital.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/hospital.png"},{"word":"Hotel","entry":"hotel","definition":"Establecimiento de hostelería capaz de alojar con comodidad a huéspedes o viajeros.","video":"https://panel.fundacioncnse-dilse.org/storage/hotel.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/hotel.png"},{"word":"Hoy","entry":"hoy","definition":"1. En este día.\n2. En el tiempo presente.","video":"https://panel.fundacioncnse-dilse.org/storage/hoy.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/hoy.png"},{"word":"Huelva","entry":"Huelva","definition":"1. Ciudad española que está localizada en la parte sudoeste de España.\n2. Provincia de la comunidad autónoma de Andalucía.\n3. Capital de la provincia que lleva el mismo nombre.","video":"https://panel.fundacioncnse-dilse.org/storage/huelva.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/huelva.png"},{"word":"Iglesia","entry":"iglesia","definition":"Templo cristiano.","video":"https://panel.fundacioncnse-dilse.org/storage/iglesia.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/iglesia.png"},{"word":"Igual","entry":"igual","definition":"Que tiene las mismas características que otra persona o cosa en algún aspecto o en todos.","video":"https://panel.fundacioncnse-dilse.org/storage/igual.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/igual.png"},{"word":"Inglaterra","entry":"Inglaterra","definition":"País que está localizado en el noroeste de Europa.","video":"https://panel.fundacioncnse-dilse.org/storage/inglaterra.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/inglaterra.png"},{"word":"Interior","entry":"interior","definition":"1. Que está en la parte de adentro.\n2. Dicho de una habitación o de una vivienda: Que no tiene vistas a la calle.\n3. Perteneciente o relativo a la nación de que se habla, en contraposición a lo extranjero.\n4. Secuencias rodadas con decorados que representan espacios cerrados.","video":"https://panel.fundacioncnse-dilse.org/storage/interior.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/interior.png"},{"word":"Internet","entry":"internet","definition":"Red informática mundial, descentralizada, formada por la conexión directa entre computadoras mediante un protocolo especial de comunicación.","video":"https://panel.fundacioncnse-dilse.org/storage/internet.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/internet.png"},{"word":"Intérprete","entry":"intérprete","definition":"Persona que interpreta.","video":"https://panel.fundacioncnse-dilse.org/storage/interprete-actor.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/interprete-actor.png"},{"word":"Invierno","entry":"invierno","definition":"1. Estación del año que, astronómicamente, comienza en el solsticio del mismo nombre y termina en el equinoccio de primavera.\n2. Época más fría del año, que en el hemisferio boreal corresponde a los meses de diciembre, enero y febrero, y en el austral a los de junio, julio y agosto.","video":"https://panel.fundacioncnse-dilse.org/storage/invierno.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/invierno.png"},{"word":"Invitar","entry":"invitar","definition":"Llamar a alguien para un convite o para asistir a algún acto.","video":"https://panel.fundacioncnse-dilse.org/storage/invitar_B.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/invitar_B.png"},{"word":"Isla","entry":"isla","definition":"Porción de tierra rodeada de agua por todas partes.","video":"https://panel.fundacioncnse-dilse.org/storage/isla.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/isla.png"},{"word":"Islas Baleares","entry":"Iisla (#Islas Baleares)","definition":"Comunidad autónoma española que está localizada en el mar Mediterráneo enfrente de la costa oriental de España, formada por una única provincia y cuya capital es Palma.","video":"https://panel.fundacioncnse-dilse.org/storage/islas_baleares.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/islas_baleares.png"},{"word":"Italia","entry":"Italia","definition":"País que está localizado en la parte sur y central de Europa.","video":"https://panel.fundacioncnse-dilse.org/storage/italia.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/Italia.png"},{"word":"Jabón","entry":"jabón","definition":"Producto soluble en agua, resultante de la combinación de un álcali con los ácidos del aceite u otro cuerpo graso, y utilizado generalmente para lavar.","video":"https://panel.fundacioncnse-dilse.org/storage/jabon.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/jabon.png"},{"word":"Jarra","entry":"jarra","definition":"Vasija de barro, porcelana, loza, cristal, etc., con cuello y boca anchos y una o dos asas.","video":"https://panel.fundacioncnse-dilse.org/storage/jarra.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/jarra.png"},{"word":"Jefe/a","entry":"jefe, fa","definition":"Persona que manda y dirige a otras, o que tiene el mando en un lugar o ámbito determinado.","video":"https://panel.fundacioncnse-dilse.org/storage/jefe.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/jefe.png"},{"word":"Jersey","entry":"jersey","definition":"Prenda de vestir de punto, cerrada y con mangas, que cubre desde el cuello hasta la cintura aproximadamente.","video":"https://panel.fundacioncnse-dilse.org/storage/jersey.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/jersey.png"},{"word":"Jubilado/a","entry":"jubilado, da","definition":"1. Dicho de una persona: Que ha sido jubilada.\n2. Persona que, cumplido el ciclo laboral establecido para ello, deja de trabajar por su edad y percibe una pensión.","video":"https://panel.fundacioncnse-dilse.org/storage/jubilado.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/jubilado.png"},{"word":"Jueves","entry":"jueves","definition":"Cuarto día de la semana.","video":"https://panel.fundacioncnse-dilse.org/storage/jueves.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/jueves.png"},{"word":"Juez/a","entry":"juez, za","definition":"Persona que tiene autoridad y potestad para juzgar y sentenciar.","video":"https://panel.fundacioncnse-dilse.org/storage/juez.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/juez.png"},{"word":"Jugar","entry":"jugar","definition":"Hacer algo con alegría con el fin de entretenerse o divertirse.","video":"https://panel.fundacioncnse-dilse.org/storage/jugar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/jugar.png"},{"word":"Julio","entry":"julio","definition":"Séptimo mes del año, que tiene 31 días.","video":"https://panel.fundacioncnse-dilse.org/storage/julio.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/julio.png"},{"word":"Junto","entry":"junto, ta","definition":"Unido, cercano.","video":"https://panel.fundacioncnse-dilse.org/storage/junto.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/junto.png"},{"word":"La Rioja","entry":"La Rioja","definition":"Comunidad autónoma que está localizada en la parte norte y central de España, formada por una única provincia y cuya capital es Logroño.","video":"https://panel.fundacioncnse-dilse.org/storage/la_rioja.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/la_rioja.png"},{"word":"Las Palmas de Gran canaria","entry":"Las Palmas de Gran Canaria","definition":"1. Ciudad española que está localizada al noroeste de la Isla de Gran Caanrias.\n2. Capital de la provincia de Las Palmas en la comunidad autónoma de Canarias.\n3. Una de las capitales de la comunidad autónoma de Canarias.","video":"https://panel.fundacioncnse-dilse.org/storage/las_palmas_de_gran_canaria.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/las_palmas_de_gran_canaria.png"},{"word":"Lata (conserva)","entry":"lata","definition":"Envase hecho de hojalata.","video":"https://panel.fundacioncnse-dilse.org/storage/lata.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/lata.png"},{"word":"Lata (refresco)","entry":"lata","definition":"Envase hecho de hojalata.","video":"https://panel.fundacioncnse-dilse.org/storage/lata.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/lata.png"},{"word":"Lavadora","entry":"lavadora","definition":"Máquina para lavar la ropa.","video":"https://panel.fundacioncnse-dilse.org/storage/lavadora.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/lavadora.png"},{"word":"Lechuga","entry":"lechuga","definition":"Hortaliza de hojas verdes y grandes que suele comerse en ensalada.","video":"https://panel.fundacioncnse-dilse.org/storage/lechuga.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/lechuga.png"},{"word":"Leer","entry":"leer","definition":"Pasar la vista por lo escrito o impreso comprendiendo la significación de los caracteres empleados.","video":"https://panel.fundacioncnse-dilse.org/storage/leer.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/leer.png"},{"word":"Lejos","entry":"lejos","definition":"A gran distancia, en lugar o tiempo distante o remoto.","video":"https://panel.fundacioncnse-dilse.org/storage/lejos.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/lejos.png"},{"word":"Lento/a","entry":"lento, ta","definition":"1. Acción o proceso que se produce a poca velocidad.\n2. Lentamente.","video":"https://panel.fundacioncnse-dilse.org/storage/lento.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/lento.png"},{"word":"León","entry":"León","definition":"1. Ciudad española que está localizada en la parte noroeste de España.\n2. Provincia de la comunidad autónoma de Castilla y León.\n3. Capital de la provincia que lleva el mismo nombre.","video":"https://panel.fundacioncnse-dilse.org/storage/leon-provincia.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/leon-provincia.png"},{"word":"Libro","entry":"libro","definition":"Conjunto de muchas hojas de papel u otro material semejante que, encuadernadas, forman un volumen.","video":"https://panel.fundacioncnse-dilse.org/storage/libro.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/libro.png"},{"word":"Limpiar","entry":"limpiar","definition":"Quitar la suciedad o inmundicia de alguien o de algo.","video":"https://panel.fundacioncnse-dilse.org/storage/limpiar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/limpiar.png"},{"word":"Limpio/a","entry":"limpio, pia","definition":"1. Que no tiene mancha o suciedad.\n2. Que tiene el hábito del aseo y la pulcritud.\n3. Inocente o que no tiene culpa.\n4. Limpiamente.\n5. Dicho de una persona: Que no debe nada.","video":"https://panel.fundacioncnse-dilse.org/storage/limpio.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/limpio.png"},{"word":"Literatura","entry":"literatura","definition":"1. Arte de la expresión verbal.\n2. Conjunto de las producciones literarias de una nación, de una época o de un género.\n3. Conjunto de conocimientos sobre literatura.","video":"https://panel.fundacioncnse-dilse.org/storage/literatura.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/literatura.png"},{"word":"Litro","entry":"litro","definition":"1. Unidad de volumen equiparable al decímetro cúbico.\n2. Cantidad de líquido que cabe en un litro.","video":"https://panel.fundacioncnse-dilse.org/storage/litro.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/litro.png"},{"word":"Llamar a la puerta","entry":"puerta (#estar, o llamar, a la puerta, o a las puertas, algo)","definition":"Estar muy próximo a suceder.","video":"https://panel.fundacioncnse-dilse.org/storage/puerta_estar_a_las_.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/puerta_estar_a_las.png"},{"word":"Llamar/Llamada","entry":"llamar","definition":"Realizar las operaciones necesarias para establecer comunicación telefónica con alguien.","video":"https://panel.fundacioncnse-dilse.org/storage/llamar-telefono.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/llamar-telefono.png"},{"word":"Llave","entry":"llave","definition":"Instrumento, comúnmente metálico, que, introducido en una cerradura, permite activar el mecanismo que la abre y la cierra.","video":"https://panel.fundacioncnse-dilse.org/storage/llave.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/llave.png"},{"word":"Lleida","entry":"Lleida","definition":"1. Ciudad española que está localizada en la parte noreste de España.\n2. Provincia de la comunidad autónoma de Cataluña\n3. Capital de la provincia que lleva el mismo nombre.","video":"https://panel.fundacioncnse-dilse.org/storage/lleida.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/lleida.png"},{"word":"Lluvia/Llover","entry":"llover","definition":"Caer agua de las nubes.","video":"https://panel.fundacioncnse-dilse.org/storage/llover.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/llover.png"},{"word":"Lugo","entry":"Lugo","definition":"1. Ciudad española que está localizada en la parte noroeste de España.\n2. Provincia de la comunidad autónoma de Galicia\n3. Capital de la provincia que lleva el mismo nombre.","video":"https://panel.fundacioncnse-dilse.org/storage/lugo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/lugo.png"},{"word":"Lunes","entry":"lunes","definition":"Primer día de la semana.","video":"https://panel.fundacioncnse-dilse.org/storage/lunes.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/lunes.png"},{"word":"Luz","entry":"luz","definition":"Agente físico que hace visibles los objetos.","video":"https://panel.fundacioncnse-dilse.org/storage/luz.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/luz.png"},{"word":"Lámpara","entry":"lámpara","definition":"Utensilio o aparato que, colgado o sostenido sobre un pie, sirve de soporte a una o varias luces artificiales.","video":"https://panel.fundacioncnse-dilse.org/storage/lampara.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/lampara.png"},{"word":"Madera","entry":"madera","definition":"1. Parte sólida de los árboles cubierta por la corteza.\n2. Pieza de madera labrada que sirve para cualquier obra de carpintería.","video":"https://panel.fundacioncnse-dilse.org/storage/madera.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/madera.png"},{"word":"Malo/a (calidad)","entry":"malo, la","definition":"1. De valor negativo, falto de las cualidades que cabe atribuirle por su naturaleza, función o destino.\n2. Dicho de una cosa: Deteriorada o estropeada.\n3. Inhábil, torpe, especialmente en su profesión.","video":"https://panel.fundacioncnse-dilse.org/storage/malo-calidad.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/malo-calidad.png"},{"word":"Malo/a (carácter)","entry":"malo, la","definition":"1. De valor negativo, falto de las cualidades que cabe atribuirle por su naturaleza, función o destino.\n2. Dicho de una cosa: Deteriorada o estropeada.\n3. Inhábil, torpe, especialmente en su profesión.","video":"https://panel.fundacioncnse-dilse.org/storage/malo-calidad.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/malo-calidad.png"},{"word":"Mano","entry":"mano","definition":"Parte del cuerpo humano unida a la extremidad del antebrazo y que comprende desde la muñeca inclusive hasta la punta de los dedos.","video":"https://panel.fundacioncnse-dilse.org/storage/mano-cuerpo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mano-cuerpo.png"},{"word":"Manta","entry":"manta","definition":"Pieza de lana, algodón u otro material, de forma rectangular, que sirve de abrigo en la cama.","video":"https://panel.fundacioncnse-dilse.org/storage/manta.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/manta.png"},{"word":"Mantequilla","entry":"mantequilla","definition":"Producto graso y pastoso que se obtiene batiendo la nata de la leche.","video":"https://panel.fundacioncnse-dilse.org/storage/mantequilla.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mantequilla.png"},{"word":"Manzana","entry":"manzana","definition":"Fruto redondo y comestible del manzano, de piel delgada, verde roja o amarilla, y carne amarillenta, entre ácida y dulce, dle cual existen diversas variedades.","video":"https://panel.fundacioncnse-dilse.org/storage/manzana.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/manzana.png"},{"word":"Mapa","entry":"mapa","definition":"Representación geográfica de la Tierra o parte de ella en una superficie plana.","video":"https://panel.fundacioncnse-dilse.org/storage/mapa.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mapa.png"},{"word":"Mar","entry":"mar","definition":"1. Masa de agua salada que cubre la mayor parte de la superficie terrestre.\n2. Cada una de las partes en que se considera dividido el mar.\n3. Lago de cierta extensión.","video":"https://panel.fundacioncnse-dilse.org/storage/mar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mar.png"},{"word":"Marisco","entry":"marisco","definition":"Animal marino invertebrado, y especialmente los crustáceos y moluscos comestibles.","video":"https://panel.fundacioncnse-dilse.org/storage/marisco.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/marisco.png"},{"word":"Marrón","entry":"marrón","definition":"1. Dicho de un color: Semejante al de la cáscara de la castaña o el pelaje de la ardilla.\n2. De color marrón.","video":"https://panel.fundacioncnse-dilse.org/storage/marron.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/marron.png"},{"word":"Martes","entry":"martes","definition":"Segundo día de la semana.","video":"https://panel.fundacioncnse-dilse.org/storage/martes.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/martes.png"},{"word":"Marzo","entry":"marzo","definition":"Tercer mes del año, que tiene 31 días.","video":"https://panel.fundacioncnse-dilse.org/storage/marzo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/marzo.png"},{"word":"Mayo","entry":"mayo","definition":"Quinto mes del año, que tiene 31 días.","video":"https://panel.fundacioncnse-dilse.org/storage/mayo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mayo.png"},{"word":"Mayor (edad avanzada)","entry":"mayor","definition":"Dicho de una persona: Entrada en años, de edad avanzada.","video":"https://panel.fundacioncnse-dilse.org/storage/mayor-adulto.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mayor-adulto.png"},{"word":"Mayor (rango familiar)","entry":"mayor","definition":"Dicho de una persona: El que tiene más edad de su rango familiar.","video":"https://panel.fundacioncnse-dilse.org/storage/mayor-familia.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mayor-familia.png"},{"word":"Mayoría","entry":"mayoría","definition":"1. Mayor número de votos conformes en una votación.\n2. La mayor parte de un número o de una serie de cosas que se expresa.","video":"https://panel.fundacioncnse-dilse.org/storage/mayoria.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mayoria.png"},{"word":"Mañana (día después)","entry":"mañana","definition":"Parte del día que transcurre desde que amanece hasta el mediodía.","video":"https://panel.fundacioncnse-dilse.org/storage/manana-dia.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/manana-dia.png"},{"word":"Mañana (periodo del día)","entry":"mañana","definition":"Parte del día que transcurre desde que amanece hasta el mediodía.","video":"https://panel.fundacioncnse-dilse.org/storage/manana-dia.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/manana-dia.png"},{"word":"Media","entry":"media","definition":"Media aritmética.","video":"https://panel.fundacioncnse-dilse.org/storage/media-matematicas.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/media-matematicas.png"},{"word":"Medicina","entry":"medicina","definition":"Ciencia que se ocupa de la prevención y curación de las enfermedades humanas.","video":"https://panel.fundacioncnse-dilse.org/storage/medicina.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/medicina.png"},{"word":"Mejor","entry":"mejor","definition":"Preferible o más conveniente.","video":"https://panel.fundacioncnse-dilse.org/storage/mejor-bien.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mejor-bien.png"},{"word":"Mejor (comodidad, salud)","entry":"mejor","definition":"1. Más bien (recobrar la salud).\n2. Más bien (con más comodidad o más gusto).","video":"https://panel.fundacioncnse-dilse.org/storage/mejor-mejorar_a.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mejor-mejorar_a.png"},{"word":"Mejor (salud)","entry":"mejor","definition":"1. Más bien (recobrar la salud).\n2. Más bien (con más comodidad o más gusto).","video":"https://panel.fundacioncnse-dilse.org/storage/mejor-mejorar_a.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mejor-mejorar_a.png"},{"word":"Melilla","entry":"Melilla","definition":"Ciudad autónoma española que está localizada en la parte norte y central de África.","video":"https://panel.fundacioncnse-dilse.org/storage/melilla.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/melilla.png"},{"word":"Menos","entry":"menos","definition":"1. Indica que el grado de la propiedad que expresa es bajo en comparación con otro explícito o sobrentendido.\n2. Indica que la situación descrita tiene lugar con menor frecuencia, intensidad o duración que otra explícita o sobrentendida.\n3. Expresa que una determinada cantidad es menor que otra sobrentendida o explícita.\n4. Número o cantidad inferior de algo mencionado.","video":"https://panel.fundacioncnse-dilse.org/storage/menos_a.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/menos_a.png"},{"word":"Menos cuarto (hora)","entry":"cuarto, ta (#menos cuarto)","definition":"Que se refiere a los últimos quince minutos de una hora.","video":"https://panel.fundacioncnse-dilse.org/storage/cuarto-menos.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/cuarto-menos.png"},{"word":"Menos mal","entry":"mal (#menos mal)","definition":"Para indicar alivio porque no ocurre o no ha ocurrido algo malo que se temía, o porque ocurre o ha ocurrido algo bueno con lo que apenas se contaba.","video":"https://panel.fundacioncnse-dilse.org/storage/mal_menos.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mal_menos.png"},{"word":"Merendar/Merienda","entry":"merienda","definition":"Comida ligera que se toma a media tarde.","video":"https://panel.fundacioncnse-dilse.org/storage/merienda.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/merienda.png"},{"word":"Mes","entry":"mes","definition":"Cada una de las doce partes en que se divide el año.","video":"https://panel.fundacioncnse-dilse.org/storage/mes.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mes.png"},{"word":"Mesa","entry":"mesa","definition":"Mueble compuesto de un tablero horizontal liso y sostenido a la altura conveniente, generalmente por una o varias patas, para diferentes usos, como escribir, comer, etc.","video":"https://panel.fundacioncnse-dilse.org/storage/mesa.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mesa.png"},{"word":"Metal","entry":"metal","definition":"1. Elemento que se caracteriza por ser un buen conductor del calor y de la electricidad y por tener un brillo característico.\n2. Materia hecha con metal.","video":"https://panel.fundacioncnse-dilse.org/storage/metal.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/metal.png"},{"word":"Metro (transporte)","entry":"metro","definition":"Tren eléctrico, generalmente subterráneo, que circula por los distintos barrios de una ciudad.","video":"https://panel.fundacioncnse-dilse.org/storage/metro-tren.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/metro-tren.png"},{"word":"Mi","entry":"mi","definition":"De la persona que habla, signa o escribe","video":"https://panel.fundacioncnse-dilse.org/storage/mi.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mi.png"},{"word":"Microondas","entry":"microondas","definition":"Horno que, provisto de un sistema generador de ondas electromagnéticas de alta frecuencia, sirve para cocinar y especialmente para calentar con gran rapidez los alimentos.","video":"https://panel.fundacioncnse-dilse.org/storage/microondas.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/microondas.png"},{"word":"Minuto","entry":"minuto","definition":"Tiempo que equivale a 60 segundos.","video":"https://panel.fundacioncnse-dilse.org/storage/minuto.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/minuto.png"},{"word":"Miércoles","entry":"miércoles","definition":"Tercer día de la semana.","video":"https://panel.fundacioncnse-dilse.org/storage/miercoles.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/miercoles.png"},{"word":"Moneda","entry":"moneda","definition":"1. Pieza de oro, plata, cobre u otro metal, regularmente en forma de disco y acuñada con los distintivos elegidos por la autoridad emisora para acreditar su legitimidad y valor, y, por extensión, billete o papel de curso legal.\n2. Dinero.","video":"https://panel.fundacioncnse-dilse.org/storage/moneda.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/moneda.png"},{"word":"Montaña","entry":"montaña","definition":"Gran elevación natural del terreno.","video":"https://panel.fundacioncnse-dilse.org/storage/montana-naturaleza.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/montana-naturaleza.png"},{"word":"Morado/a","entry":"morado, da","definition":"1. Dicho de un color: Que está entre el rojo y el azul.\n2. De color morado.","video":"https://panel.fundacioncnse-dilse.org/storage/morado.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/morado.png"},{"word":"Moreno/a","entry":"moreno, na","definition":"De color moreno.","video":"https://panel.fundacioncnse-dilse.org/storage/moreno-piel.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/moreno-piel.png"},{"word":"Mosca","entry":"mosca","definition":"Insecto pequeño de color negro, con dos alas transparentes y cabeza ovalada, del que existen varias especies.","video":"https://panel.fundacioncnse-dilse.org/storage/mosca.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mosca.png"},{"word":"Mosquito","entry":"mosquito","definition":"Insecto de pequeño tamaño,o con patas largas y finas, y dos alas transparentes que producen un sonido agudo, cuya hembra chupa la sangre a los mamíferos, y del que existen varias especies, por ejemplo, mosquito anofeles.","video":"https://panel.fundacioncnse-dilse.org/storage/mosquito.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mosquito.png"},{"word":"Motivo","entry":"motivo","definition":"Causa o razón que mueve para algo.","video":"https://panel.fundacioncnse-dilse.org/storage/motivo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/motivo.png"},{"word":"Moto","entry":"moto","definition":"Vehículo automóvil de dos ruedas, con uno o dos sillines y, a veces, con sidecar.","video":"https://panel.fundacioncnse-dilse.org/storage/moto.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/moto.png"},{"word":"Mudo/a","entry":"mudo, da","definition":"Privado de la facultad de hablar.","video":"https://panel.fundacioncnse-dilse.org/storage/mudo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mudo.png"},{"word":"Mueble","entry":"mueble","definition":"Cada uno de los enseres movibles que sirven para los usos necesarios o para decorar casas, oficinas y todo género de locales.","video":"https://panel.fundacioncnse-dilse.org/storage/mueble.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mueble.png"},{"word":"Muela","entry":"muela","definition":"Cada uno de los dientes posteriores a los caninos y que sirven para moler o triturar los alimentos.","video":"https://panel.fundacioncnse-dilse.org/storage/muela.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/muela.png"},{"word":"Mujer","entry":"mujer","definition":"Persona del sexo femenino.","video":"https://panel.fundacioncnse-dilse.org/storage/mujer.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mujer.png"},{"word":"Mundo","entry":"mundo","definition":"1. Conjunto de todo lo existente.\n2. Esfera con que se representa el globo terráqueo.\n3. Planeta del sistema solar donde habitan los seres humanos.","video":"https://panel.fundacioncnse-dilse.org/storage/mundo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mundo.png"},{"word":"Murcia","entry":"Murcia","definition":"1. Ciudad española que está localizada en la parte sureste de España.\n2. Capital de la comunidad autónoma de la Región de Murcia.","video":"https://panel.fundacioncnse-dilse.org/storage/murcia.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/murcia.png"},{"word":"Museo","entry":"museo","definition":"1. Lugar en que se conservan y exponen colecciones de objetos artísticos, científicos, etc.\n2. Institución, sin fines de lucro, cuya finalidad consiste en la adquisición, conservación, estudio y exposición al público de objetos de interés cultural.\n3. Lugar donde se exhiben objetos o curiosidades que pueden atraer el interés del público, con fines turísticos.","video":"https://panel.fundacioncnse-dilse.org/storage/museo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/museo.png"},{"word":"Málaga","entry":"Málaga","definition":"1. Ciudad española que está localizada en la parte sur y central de España.\n2. Provincia de la comunidad autónoma de Andalucía.\n3. Capital de la provincia que lleva el mismo nombre.","video":"https://panel.fundacioncnse-dilse.org/storage/malaga.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/malaga.png"},{"word":"Máquina de afeitar","entry":"máquina (#máquina de afeitar)","definition":"Aparato constituido por un mango en uno de cuyos extremos hay un dispositivo donde se aloja una cuchilla y que sirve para rasurar.","video":"https://panel.fundacioncnse-dilse.org/storage/maquina-afeitar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/maquina-afeitar.png"},{"word":"Más (exceso)","entry":"más","definition":"Denota exceso indeterminado con relación a una cantidad expresa.","video":"https://panel.fundacioncnse-dilse.org/storage/mas_a.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mas_a.png"},{"word":"Más que…","entry":"más (#¿qué más quieres?)","definition":"Reproche que se le hace a alguien.","video":"https://panel.fundacioncnse-dilse.org/storage/mas_quieres_que.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mas_quieres_que.png"},{"word":"Médico/a","entry":"médico, ca","definition":"1. Perteneciente o relativo a la medicina.\n2. Persona legalmente autorizada para ejercer la medicina.","video":"https://panel.fundacioncnse-dilse.org/storage/medico.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/medico.png"},{"word":"Mío/a","entry":"mío, a","definition":"De la persona que habla, signa o escribe","video":"https://panel.fundacioncnse-dilse.org/storage/mio.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/mio.png"},{"word":"Móvil","entry":"móvil","definition":"Aparato portátil de un sistema de telefonía móvil.","video":"https://panel.fundacioncnse-dilse.org/storage/movil.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/movil.png"},{"word":"Música","entry":"música","definition":"1. Melodía, ritmo y armonía, combinados.\n2. Sucesión de sonidos modulados para recrear el oído.\n3. Arte de combinar los sonidos de la voz humana o de los instrumentos, o de unos y otros a la vez, de suerte que produzcan deleite, conmoviendo la sensibilidad, ya sea alegre, ya tristemente.","video":"https://panel.fundacioncnse-dilse.org/storage/musica_mon.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/musica_mon.png"},{"word":"Navarra","entry":"Navarra","definition":"Comunidad foral que está localizada en la parte norte y este de España cuya capital es Pamplona.","video":"https://panel.fundacioncnse-dilse.org/storage/navarra.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/navarra.png"},{"word":"Navidad","entry":"navidad","definition":"1. Día que se celebra el nacimiento de Jesucristo.\n2. Tiempo comprendido entre Nochebuena y la festividad de los Reyes Magos.","video":"https://panel.fundacioncnse-dilse.org/storage/navidad.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/navidad.png"},{"word":"Negro","entry":"negro, gra","definition":"1. Dicho de un color: Semejante al del carbón o al de la oscuridad total.\n2. De color negro.","video":"https://panel.fundacioncnse-dilse.org/storage/negro-color.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/negro-color.png"},{"word":"Nervioso/a","entry":"nervioso, sa","definition":"1. Que tiene nervios.\n2. Perteneciente o relativo a los nervios.\n3. Dicho de una persona: De nervios fácilmente excitables.\n4. Dicho de una persona: Inquieta e incapaz de permanecer en reposo.","video":"https://panel.fundacioncnse-dilse.org/storage/nervioso.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/nervioso.png"},{"word":"Nevera","entry":"nevero, ra","definition":"frigorífico, aparato electrodoméstico.","video":"https://panel.fundacioncnse-dilse.org/storage/nevera.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/nevera.png"},{"word":"Nieve/Nevar","entry":"nieve / nevar","definition":"Nieve / nevar","video":"https://panel.fundacioncnse-dilse.org/storage/nieve.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/nieve.png"},{"word":"No (negación)","entry":"no","definition":"Expresa negación.","video":"https://panel.fundacioncnse-dilse.org/storage/no.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/no.png"},{"word":"No pasa nada","entry":"nada (#no ser nada)","definition":"Para quitar importancia al daño producido.","video":"https://panel.fundacioncnse-dilse.org/storage/nada_no_ser.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/nada_no_ser.png"},{"word":"No saber","entry":"saber (#no saber)","definition":"No estar instruido en algo.","video":"https://panel.fundacioncnse-dilse.org/storage/saber-no_b.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/saber-no_b.png"},{"word":"Noche (periodo del día)","entry":"noche","definition":"Parte del día comprendida entre la puesta del sol y el amanecer.","video":"https://panel.fundacioncnse-dilse.org/storage/noche.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/noche.png"},{"word":"Nombre","entry":"nombre","definition":"1. Palabra que designa o identifica seres animados o inanimados.\n2. Clase de palabras cuyos elementos poseen género y número, forman sintagmas nominales con diversas funciones sintácticas y designan entidades de diferente naturaleza.","video":"https://panel.fundacioncnse-dilse.org/storage/nombre.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/nombre.png"},{"word":"Norte","entry":"norte","definition":"1. Punto cardinal situado al frente de un observador a cuya derecha está el este.\n2. Región o territorio situados en la parte norte de un país o de un área geográfica determinada.\n3. Lugar situado al norte de otro con cuya posición se compara.","video":"https://panel.fundacioncnse-dilse.org/storage/norte.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/norte.png"},{"word":"Nosotros/as","entry":"nosotros, tras","definition":"1. Forma que, en nominativo o precedida de preposición, designa a las personas que hablan o escriben.\n2. Forma que, en nominativo o precedida de preposición, designa a los miembros de un grupo del que forma parte quien habla o escribe.","video":"https://panel.fundacioncnse-dilse.org/storage/nosotros.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/nosotros.png"},{"word":"Noviembre","entry":"noviembre","definition":"Undécimo mes del año, que tiene 30 días.","video":"https://panel.fundacioncnse-dilse.org/storage/noviembre.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/noviembre.png"},{"word":"Novio/a","entry":"novio, via","definition":"1. Persona que mantiene relaciones amorosas con otra con fines matrimoniales.\n2. Persona que va a casarse o acaba de casarse.\n3. Persona que mantiene una relación amorosa con otra.","video":"https://panel.fundacioncnse-dilse.org/storage/novio.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/novio.png"},{"word":"Nube","entry":"nube","definition":"1. Masa de vapor de agua suspendida en la atmósfera.\n2. Espacio de almacenamiento y procesamiento de datos y archivos ubicado en internet, al que puede acceder el usuario desde cualquier dispositivo.","video":"https://panel.fundacioncnse-dilse.org/storage/nube.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/nube.png"},{"word":"Nuevo/a","entry":"nuevo, va","definition":"1. Que acaba de hacerse, formarse o aparecer.\n2. Que se percibe o se experimenta por primera vez.\n3. Distinto o diferente de lo que antes había.\n4. Principiante en una profesión o en alguna actividad.\n5. Poco o nada deteriorado por el uso.","video":"https://panel.fundacioncnse-dilse.org/storage/nuevo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/nuevo.png"},{"word":"Nunca","entry":"nunca","definition":"1. En ningún tiempo.\n2. Ninguna vez.","video":"https://panel.fundacioncnse-dilse.org/storage/nunca_2.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/nunca_2.png"},{"word":"Número","entry":"número","definition":"Expresión de una cantidad con relación a su unidad.","video":"https://panel.fundacioncnse-dilse.org/storage/numero.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/numero.png"},{"word":"O","entry":"o","definition":"1. Decimosexta letra del abecedario español, que representa el fonema vocálico medio posterior.\n2. Sonido que representa la letra o.","video":"https://panel.fundacioncnse-dilse.org/storage/o.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/o.png"},{"word":"Objetivo","entry":"objetivo","definition":"Objeto (fin o intento).","video":"https://panel.fundacioncnse-dilse.org/storage/objetivo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/objetivo.png"},{"word":"Objeto","entry":"objeto","definition":"Cosa material que se puede percibir por los sentidos.","video":"https://panel.fundacioncnse-dilse.org/storage/objeto-cosa.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/objeto-cosa.png"},{"word":"Octubre","entry":"octubre","definition":"Décimo mes del año, que tiene 31 días.","video":"https://panel.fundacioncnse-dilse.org/storage/octubre.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/octubre.png"},{"word":"Odio/Odiar","entry":"odiar","definition":"Tener odio.","video":"https://panel.fundacioncnse-dilse.org/storage/odiar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/odiar.png"},{"word":"Oeste","entry":"oeste","definition":"1. Punto cardinal situado por donde se pone el sol.\n2. Región o territorio situado al oeste de un país o de un área geográfica determinada.\n3. Lugar situado al oeste de otro lugar con cuya posición se compara.","video":"https://panel.fundacioncnse-dilse.org/storage/oeste.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/oeste.png"},{"word":"Oficina","entry":"oficina","definition":"1. Local donde se hace, se ordena o trabaja algo.\n2. Departamento donde trabajan los empleados públicos o particulares.","video":"https://panel.fundacioncnse-dilse.org/storage/oficina.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/oficina.png"},{"word":"Ojo","entry":"ojo","definition":"Órgano de la vista en el ser humano y en los animales.","video":"https://panel.fundacioncnse-dilse.org/storage/ojo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/ojo.png"},{"word":"Olla","entry":"olla","definition":"Vasija redonda de barro o metal, que comúnmente forma barriga, con cuello y boca anchos y con una o dos asas, la cual sirve para cocer alimentos, calentar agua, etc.","video":"https://panel.fundacioncnse-dilse.org/storage/olla.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/olla.png"},{"word":"Opinión/Opinar","entry":"opinión","definition":"1. Juicio o valoración que se forma una persona respecto de algo o de alguien.\n2. Fama o concepto en que se tiene a alguien o algo.","video":"https://panel.fundacioncnse-dilse.org/storage/opinion.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/opinion.png"},{"word":"Ordenador","entry":"ordenador","definition":"Máquina electrónica de tratamiento de la información, capaz de almacenar, ordenar y memorizar datos a gran velocidad, gracias al empleo de diversos programas.","video":"https://panel.fundacioncnse-dilse.org/storage/ordenador.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/ordenador.png"},{"word":"Oreja","entry":"oreja","definition":"Órgano externo de la audición.","video":"https://panel.fundacioncnse-dilse.org/storage/oreja.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/oreja.png"},{"word":"Oscuro/a","entry":"oscuro, ra","definition":"Que carece de luz o claridad.","video":"https://panel.fundacioncnse-dilse.org/storage/oscuro-sin-luz.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/oscuro-sin-luz.png"},{"word":"Otoño","entry":"otoño","definition":"1. Estación del año que, astronómicamente, comienza en el equinoccio del mismo nombre y termina en el solsticio de invierno.\n2. Época templada del año, que en el hemisferio boreal corresponde a los meses de septiembre, octubre y noviembre, y en el austral a los de marzo, abril y mayo.","video":"https://panel.fundacioncnse-dilse.org/storage/otono.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/otono.png"},{"word":"Otro/a","entry":"otro, tra","definition":"Dicho de una persona o de una cosa: Distinta de aquella de que se habla.","video":"https://panel.fundacioncnse-dilse.org/storage/otro.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/otro.png"},{"word":"Ourense","entry":"Ourense","definition":"1. Ciudad española que está localizada en la parte noroeste de España.\n2. Provincia de la comunidad autónoma de Galicia.\n3. Capital de la provincia que lleva el mismo nombre.","video":"https://panel.fundacioncnse-dilse.org/storage/ourense.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/ourense.png"},{"word":"Oyente","entry":"oyente","definition":"Que oye.","video":"https://panel.fundacioncnse-dilse.org/storage/oyente.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/oyente.png"},{"word":"Oído","entry":"oído","definition":"Cada uno de los órganos que sirven para la audición.","video":"https://panel.fundacioncnse-dilse.org/storage/oido.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/oido.png"},{"word":"Oír","entry":"oír","definition":"Percibir con el oído los sonidos.","video":"https://panel.fundacioncnse-dilse.org/storage/oir.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/oir.png"},{"word":"Padre","entry":"padre","definition":"Varón o animal macho que ha engendrado a otro ser de su misma especie.","video":"https://panel.fundacioncnse-dilse.org/storage/padre.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/padre.png"},{"word":"Padres","entry":"Asociación de Padres y Amigos de los Sordos (ASPAS)","definition":"Entidad sin ánimo de lucro, formada fundamentalmente por padres y amigos de discapacitados auditivos.","video":"https://panel.fundacioncnse-dilse.org/storage/asociacion-aspas.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/asociacion-aspas.png"},{"word":"Paella","entry":"paella","definition":"Plato de arroz seco, con carne, pescado, mariscos, legumbres, etc., característico de la región valenciana, en España.","video":"https://panel.fundacioncnse-dilse.org/storage/paella.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/paella.png"},{"word":"Pagar","entry":"pagar","definition":"Dicho de una persona: Dar a otra, o satisfacer, el dinero que le debe.","video":"https://panel.fundacioncnse-dilse.org/storage/pagar_mon.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pagar_mon.png"},{"word":"Palencia","entry":"Palencia","definition":"1. Ciudad española que está localizada en la parte norte y central de España.\n2. Provincia de la comunidad autónoma de Castilla y León.\n3. Capital de la provincia que lleva el mismo nombre.","video":"https://panel.fundacioncnse-dilse.org/storage/palencia.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/palencia.png"},{"word":"Palma de Mallorca","entry":"Palma de Mallorca","definition":"1. Ciudad española que está localizada en la parte oeste de la isla de Mallorca.\n2. Capital de la comunidad autónoma uniprovincial Islas Baleares.\n3. Capital de la isla de Mallorca.","video":"https://panel.fundacioncnse-dilse.org/storage/palma-mallorca.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/palma-mallorca.png"},{"word":"Pamplona","entry":"Pamplona","definition":"1. Ciudad española que está localizada en la parte norte y central de España.\n2. Capital de la Comunidad Foral de Navarra.","video":"https://panel.fundacioncnse-dilse.org/storage/pamplona.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pamplona.png"},{"word":"Pan","entry":"pan","definition":"1. Alimento que consiste en una masa de harina, por lo común de trigo, levadura y agua, cocida en un horno.\n2. Pieza de pan, especialmente si tiene forma redonda y es grande.","video":"https://panel.fundacioncnse-dilse.org/storage/pan.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pan.png"},{"word":"Papel","entry":"papel","definition":"1. Hoja delgada hecha con pasta de fibras vegetales obtenidas de trapos, madera, paja, etc., molidas, blanqueadas y desleídas en agua, que se hace secar y endurecer por procedimientos especiales.\n2. Pliego, hoja o pedazo de papel en blanco, manuscrito o impreso.","video":"https://panel.fundacioncnse-dilse.org/storage/papel.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/papel.png"},{"word":"Papel higiénico","entry":"papel higiénico","definition":"Papel que se usa para la higiene personal.","video":"https://panel.fundacioncnse-dilse.org/storage/papel_higienico.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/papel_higienico.png"},{"word":"Para","entry":"para","definition":"Denota el fin o término a que se encamina una acción.","video":"https://panel.fundacioncnse-dilse.org/storage/para-objetivo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/para-objetivo.png"},{"word":"Para siempre","entry":"por siempre","definition":"Perpetuamente o por tiempo sin fin.","video":"https://panel.fundacioncnse-dilse.org/storage/siempre_para.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/siempre_para.png"},{"word":"Para ti","entry":"para (#para ti)","definition":"Para indicar que se da algo específicamente a la persona con la que se está hablando o signando.","video":"https://panel.fundacioncnse-dilse.org/storage/para-ti.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/para-ti.png"},{"word":"Parada","entry":"parada","definition":"Acción de parar o detenerse.","video":"https://panel.fundacioncnse-dilse.org/storage/parada.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/parada.png"},{"word":"Parado/a (desempleo)","entry":"parado, da","definition":"Desocupado, o sin ejercicio o empleo.","video":"https://panel.fundacioncnse-dilse.org/storage/parado-desempleado.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/parado-desempleado.png"},{"word":"Paraguas","entry":"paraguas","definition":"Utensilio portátil para resguardarse de la lluvia, compuesto de un eje y de un varillaje cubierto de tela u otro material, que puede extenderse y plegarse.","video":"https://panel.fundacioncnse-dilse.org/storage/paraguas.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/paraguas.png"},{"word":"Parchís","entry":"parchís","definition":"Juego de mesa que se practica en un tablero con cuatro salidas y con casillas numeradas, en el que cada jugador trata de hacer llegar sus cuatro fichas, avanzando según determina el dado, a la casilla central, y gana el primero que lo consigue.","video":"https://panel.fundacioncnse-dilse.org/storage/parchis.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/parchis.png"},{"word":"Pared","entry":"pared","definition":"1. Obra de albañilería vertical, que cierra o limita un espacio.\n2. Placa de cualquier material con que se divide o cierra un espacio.\n3. En el fútbol, jugada entre dos compañeros del mismo equipo, que consiste en que el primero, con el fin de eludir al contrario, pasa la pelota al segundo, que se la devuelve inmediatamente unos metros más adelantada.","video":"https://panel.fundacioncnse-dilse.org/storage/pared.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pared.png"},{"word":"Pareja","entry":"pareja","definition":"1. Compañero o compañera del sexo opuesto o, en las parejas homosexuales, del mismo sexo.\n2. Conjunto de dos personas o animales que tienen entre sí alguna correlación.\n3. Cada una de estas personas o animales considerada en relación con la otra.","video":"https://panel.fundacioncnse-dilse.org/storage/pareja.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pareja.png"},{"word":"Parque","entry":"parque","definition":"1. En una población, espacio que se dedica a praderas, jardines y arbolado, con ornamentos diversos, para el esparcimiento de sus habitantes.\n2. Espacio cercado, con vegetación, destinado a recreo o caza, generalmente inmediato a un palacio o a una población.\n3. Espacio natural, legalmente protegido que, por su belleza, o por la singularidad de su fauna y flora, posee valor ecológico y cultural.\n4. Parque infantil.","video":"https://panel.fundacioncnse-dilse.org/storage/parque.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/parque.png"},{"word":"Pasado","entry":"pasado","definition":"Tiempo anterior al presente.","video":"https://panel.fundacioncnse-dilse.org/storage/pasado_b.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pasado_b.png"},{"word":"Pasaporte","entry":"pasaporte","definition":"Licencia o despacho por escrito que se da para poder pasar libre y seguramente de un pueblo o país a otro.","video":"https://panel.fundacioncnse-dilse.org/storage/pasaporte.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pasaporte.png"},{"word":"Pasillo","entry":"pasillo","definition":"Pieza de paso larga y estrecha, en el interior de un edificio.","video":"https://panel.fundacioncnse-dilse.org/storage/pasillo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pasillo.png"},{"word":"Pasta","entry":"pasta","definition":"Masa preparada con harina con la que se hacen los fideos, tallarines, macarrones, canelones, raviolis, etc.","video":"https://panel.fundacioncnse-dilse.org/storage/pasta.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pasta.png"},{"word":"Pasta de dientes","entry":"pasta (#pasta de dientes)","definition":"Pasta empleada como dentífrico.","video":"https://panel.fundacioncnse-dilse.org/storage/pasta_de_dientes.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pasta_de_dientes.png"},{"word":"Patata","entry":"patata","definition":"Tubérculo comestible, redondeado, con piel de color terroso e interior amarillento y harinoso.","video":"https://panel.fundacioncnse-dilse.org/storage/patata.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/patata.png"},{"word":"Paz","entry":"paz","definition":"1. Situación en la que no existe lucha armada en un país o entre países.\n2. Relación de armonía entre las personas, sin enfrentamientos ni conflictos.\n3. Acuerdo alcanzado entre las naciones por el que se pone fin a una guerra.\n4. Estado de quien no está perturbado por ningún conflicto o inquietud.\n5. En el cristianismo, sentimiento de armonía interior que reciben de Dios los fieles.\n6. En la misa, saludo que los fieles se dan mutuamente como signo de paz y reconciliación.","video":"https://panel.fundacioncnse-dilse.org/storage/paz_I.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/paz_I.png"},{"word":"País","entry":"país","definition":"1. Territorio constituido en Estado soberano.\n2. Región o comarca.","video":"https://panel.fundacioncnse-dilse.org/storage/pais.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pais.png"},{"word":"País Vasco","entry":"País Vasco","definition":"Comunidad autónoma que está localizada en la parte norte y central de España, formada por tres comunidades autónomas y cuya capital es Vitoria.","video":"https://panel.fundacioncnse-dilse.org/storage/pais-vasco.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pais-vasco.png"},{"word":"Peine","entry":"peine","definition":"Utensilio de madera, marfil, concha u otra materia, provisto de dientes muy juntos, con el cual se desenreda y compone el pelo.","video":"https://panel.fundacioncnse-dilse.org/storage/peine.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/peine.png"},{"word":"Pelo","entry":"pelo","definition":"1. Filamento muy delgado de los que crecen en la piel de las personas y de algunos animales.\n2. Cabello de la cabeza humana.","video":"https://panel.fundacioncnse-dilse.org/storage/pelo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pelo.png"},{"word":"Peluquería","entry":"peluquería","definition":"1. Establecimiento donde trabaja el peluquero.\n2. Oficio de peluquero.","video":"https://panel.fundacioncnse-dilse.org/storage/peluqueria.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/peluqueria.png"},{"word":"Película","entry":"película","definition":"Obra cinematográfica.","video":"https://panel.fundacioncnse-dilse.org/storage/pelicula.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pelicula.png"},{"word":"Pendiente (complemento)","entry":"pendiente","definition":"Joya o adorno que se lleva colgado de la oreja.","video":"https://panel.fundacioncnse-dilse.org/storage/pendiente.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pendiente.png"},{"word":"Pensar","entry":"pensar","definition":"1. Formar o combinar ideas o juicios en la mente.\n2. Opinar algo acerca de una persona o cosa.\n3. Tener la intención de hacer algo.\n4. Formar en la mente un juicio u opinión sobre algo.","video":"https://panel.fundacioncnse-dilse.org/storage/pensar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pensar.png"},{"word":"Peor","entry":"peor","definition":"De mala condición o de inferior calidad respecto de otra cosa con que se compara.","video":"https://panel.fundacioncnse-dilse.org/storage/peor.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/peor.png"},{"word":"Pequeño/a","entry":"pequeño, ña","definition":"1. Dicho de una persona: Baja, de poca estatura.\n2. De corta edad.","video":"https://panel.fundacioncnse-dilse.org/storage/pequeno-persona.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pequeno-persona.png"},{"word":"Perdón","entry":"perdón","definition":"Remisión de la pena merecida, de la ofensa recibida o de alguna deuda u obligación pendiente.","video":"https://panel.fundacioncnse-dilse.org/storage/perdon-perdonar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/perdon-perdonar.png"},{"word":"Perejil","entry":"perejil","definition":"Planta herbácea aromática, de hojas muy recortadas y generalmente rizadas, que se utiliza como condimento.","video":"https://panel.fundacioncnse-dilse.org/storage/perejil.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/perejil.png"},{"word":"Perfecto/a","entry":"perfecto, ta","definition":"1. Que tiene el mayor grado posible de bondad o excelencia en su línea.\n2. Que tiene las mejores cualidades posibles, o carece de errores o defectos.","video":"https://panel.fundacioncnse-dilse.org/storage/perfecto.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/perfecto.png"},{"word":"Perilla","entry":"perilla","definition":"Pelos que crecen alrededor de los labios.","video":"https://panel.fundacioncnse-dilse.org/storage/perilla.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/perilla.png"},{"word":"Periodista","entry":"periodista","definition":"Persona que se dedica al periodismo (actividad profesional).","video":"https://panel.fundacioncnse-dilse.org/storage/periodista.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/periodista.png"},{"word":"Periódico (prensa)","entry":"periódico, ca","definition":"Dicho de una fracción decimal: Que tiene período.","video":"https://panel.fundacioncnse-dilse.org/storage/periodico-matematicas.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/periodico-matematicas.png"},{"word":"Perro/a","entry":"perro, rra","definition":"Mamífero doméstico empleado por el hombre como animal de compañía y en diversos trabajos para los que puede ser adiestrado, y del que existen diversas razas.","video":"https://panel.fundacioncnse-dilse.org/storage/perro.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/perro.png"},{"word":"Persona","entry":"persona","definition":"Individuo de la especie humana.","video":"https://panel.fundacioncnse-dilse.org/storage/persona.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/persona.png"},{"word":"Pesado/a (carácter)","entry":"pesado, da","definition":"Que pesa mucho.","video":"https://panel.fundacioncnse-dilse.org/storage/pesado-pesar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pesado-pesar.png"},{"word":"Pescado","entry":"pescado","definition":"Pez comestible sacado del agua por cualquiera de los procedimientos de pesca.","video":"https://panel.fundacioncnse-dilse.org/storage/pescado.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pescado.png"},{"word":"Pez","entry":"pez","definition":"1. Animal vertebrado acuático, que respira por branquias, generalmente cubierto de escamas, con extremidades en forma de aleta y que se reproduce por huevos.\n2. En las comunidades paleocristianas, el símbolo del pez (ichtys) servía para reconocer a otros fieles de forma secreta, puesto que antes del Edicto de Milán (313 d. C.), los cristianos no podían revelar abiertamente su fe, ya que corrían el peligro de ser perseguidos o ejecutados.","video":"https://panel.fundacioncnse-dilse.org/storage/pez.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pez.png"},{"word":"Pie","entry":"pie","definition":"Extremidad de cada uno de los dos miembros inferiores del cuerpo humano.","video":"https://panel.fundacioncnse-dilse.org/storage/pie.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pie.png"},{"word":"Pierna","entry":"pierna","definition":"Extremidad inferior de las personas.","video":"https://panel.fundacioncnse-dilse.org/storage/pierna.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pierna.png"},{"word":"Pijama","entry":"pijama","definition":"Prenda para dormir, generalmente compuesta de pantalón y chaqueta de tela ligera.","video":"https://panel.fundacioncnse-dilse.org/storage/pijama.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pijama.png"},{"word":"Pimienta","entry":"pimienta","definition":"Fruto del pimentero, redondo, de pequeño tamaño, picante y muy aromático, que se utiliza, molido o entero, como condimento.","video":"https://panel.fundacioncnse-dilse.org/storage/pimienta.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pimienta.png"},{"word":"Piscina","entry":"piscina","definition":"Construcción que contiene gran cantidad de agua y que se destina al baño, a la natación o a otros ejercicios y deportes acuáticos.","video":"https://panel.fundacioncnse-dilse.org/storage/piscina.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/piscina.png"},{"word":"Piso","entry":"piso","definition":"Cada una de las superficies horizontales de las que consta un edificio.","video":"https://panel.fundacioncnse-dilse.org/storage/piso-edificio.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/piso-edificio.png"},{"word":"Pizarra","entry":"pizarra","definition":"1. Trozo de pizarra pulimentado, de forma rectangular, usado para escribir o dibujar en él con pizarrín, yeso o lápiz blanco.\n2. Superficie o tablero de un material apropiado que se utiliza para escribir y poder borrar en ellos con facilidad, especialmente en las aulas.","video":"https://panel.fundacioncnse-dilse.org/storage/pizarra.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pizarra.png"},{"word":"Pizza","entry":"pizza","definition":"Especie de torta de harina amasada, encima de la cual se pone queso, tomate frito y otros ingredientes, y que se cuece en el horno.","video":"https://panel.fundacioncnse-dilse.org/storage/pizza.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pizza.png"},{"word":"Plan","entry":"plan","definition":"Intención, proyecto.","video":"https://panel.fundacioncnse-dilse.org/storage/plan.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/plan.png"},{"word":"Plancha/Planchar","entry":"planchar","definition":"Pasar la plancha caliente sobre la ropa, para estirarla, asentarla o darle brillo.","video":"https://panel.fundacioncnse-dilse.org/storage/planchar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/planchar.png"},{"word":"Planta (naturaleza)","entry":"planta","definition":"Parte inferior del pie.","video":"https://panel.fundacioncnse-dilse.org/storage/planta-pie.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/planta-pie.png"},{"word":"Plato","entry":"plato","definition":"Recipiente bajo y redondo, con una concavidad en medio y borde comúnmente plano alrededor, empleado en las mesas para servir los alimentos y comer en él y para otros usos.","video":"https://panel.fundacioncnse-dilse.org/storage/plato.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/plato.png"},{"word":"Playa","entry":"playa","definition":"Ribera del mar o de un río grande, formada de arenales en superficie casi plana.","video":"https://panel.fundacioncnse-dilse.org/storage/playa.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/playa.png"},{"word":"Plaza","entry":"plaza","definition":"Lugar ancho y espacioso dentro de un poblado, al que suelen afluir varias calles.","video":"https://panel.fundacioncnse-dilse.org/storage/plaza.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/plaza.png"},{"word":"Plástico","entry":"plástico, ca","definition":"Dicho de ciertos materiales sintéticos: Que pueden moldearse fácilmente y están compuestos principalmente por polímeros, como la celulosa.","video":"https://panel.fundacioncnse-dilse.org/storage/plastico.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/plastico.png"},{"word":"Plátano","entry":"plátano","definition":"Fruto del platanero, de forma alargada y algo curva, piel gruesa y amarilla cuando madura, y carne blanquecina.","video":"https://panel.fundacioncnse-dilse.org/storage/platano.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/platano.png"},{"word":"Poco","entry":"poco","definition":"Un tiempo escaso o insuficiente.","video":"https://panel.fundacioncnse-dilse.org/storage/poco_c.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/poco_c.png"},{"word":"Poco (cantidad)","entry":"poco, ca","definition":"En número, cantidad o intensidad escasos respecto de lo regular, ordinario o preciso.","video":"https://panel.fundacioncnse-dilse.org/storage/poco_a.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/poco_a.png"},{"word":"Poder (verbo)","entry":"poder","definition":"Tener expedita la facultad o potencia de hacer algo.","video":"https://panel.fundacioncnse-dilse.org/storage/poder-capacidad.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/poder-capacidad.png"},{"word":"Poesía","entry":"poesía","definition":"Manifestación de la belleza o del sentimiento estético por medio de la palabra, en verso o en prosa.","video":"https://panel.fundacioncnse-dilse.org/storage/poesia.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/poesia.png"},{"word":"Policía","entry":"policía","definition":"1. Cuerpo encargado de velar por el mantenimiento del orden público y la seguridad de los ciudadanos, a las órdenes de las autoridades políticas.\n2. Miembro del cuerpo de Policía.","video":"https://panel.fundacioncnse-dilse.org/storage/policia.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/policia.png"},{"word":"Pontevedra","entry":"Pontevedra","definition":"1. Ciudad española que está localizada en la parte noroeste del país.\n2. Provincia de la comunidad autónoma de Galicia.\n3. Capital de la provincia que lleva el mismo nombre.","video":"https://panel.fundacioncnse-dilse.org/storage/pontevedra.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pontevedra.png"},{"word":"Por (causa)","entry":"por (#por que)","definition":"Por causa o razón de que.","video":"https://panel.fundacioncnse-dilse.org/storage/por-motivo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/por-motivo.png"},{"word":"Por ejemplo","entry":"ejemplo (#por ejemplo)","definition":"Cuando se va a poner un ejemplo para comprobar, ilustrar o autorizar lo que antes se ha dicho.","video":"https://panel.fundacioncnse-dilse.org/storage/ejemplo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/ejemplo.png"},{"word":"Por eso","entry":"por (#por que)","definition":"Por causa o razón de que.","video":"https://panel.fundacioncnse-dilse.org/storage/por-motivo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/por-motivo.png"},{"word":"Porque","entry":"porque","definition":"Por causa o razón de que.","video":"https://panel.fundacioncnse-dilse.org/storage/porque_mon.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/porque_mon.png"},{"word":"Porque","entry":"porque","definition":"Por causa o razón de que.","video":"https://panel.fundacioncnse-dilse.org/storage/porque_bim.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/porque_bim.png"},{"word":"Porqué (bimanual)","entry":"porque","definition":"Por causa o razón de que.","video":"https://panel.fundacioncnse-dilse.org/storage/porque_mon.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/porque_mon.png"},{"word":"Porqué (monomanual)","entry":"porque","definition":"Por causa o razón de que.","video":"https://panel.fundacioncnse-dilse.org/storage/porque_mon.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/porque_mon.png"},{"word":"Portugal","entry":"Portugal","definition":"País que está localizado en la parte suroeste de Europa.","video":"https://panel.fundacioncnse-dilse.org/storage/portugal.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/portugal.png"},{"word":"Portátil (informática)","entry":"portátil","definition":"Ordenador portátil.","video":"https://panel.fundacioncnse-dilse.org/storage/portatil.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/portatil.png"},{"word":"Postre","entry":"postre","definition":"Alimento, especialmente fruta o dulce, servido como final de una comida.","video":"https://panel.fundacioncnse-dilse.org/storage/postre.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/postre.png"},{"word":"Practicar","entry":"practicar","definition":"Ejercitar, poner en práctica algo que se ha aprendido y especulado.","video":"https://panel.fundacioncnse-dilse.org/storage/practicar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/practicar.png"},{"word":"Precio","entry":"precio","definition":"Cantidad de dinero que cuesta la compra de algo.","video":"https://panel.fundacioncnse-dilse.org/storage/precio.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/precio.png"},{"word":"Preferir","entry":"preferir","definition":"Tener alguien una cosa o a una persona por mejor que otra.","video":"https://panel.fundacioncnse-dilse.org/storage/preferir.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/preferir.png"},{"word":"Preguntar","entry":"preguntar","definition":"Interrogar o hacer preguntas a alguien para que diga y responda lo que sabe sobre un asunto.","video":"https://panel.fundacioncnse-dilse.org/storage/preguntar.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/preguntar.png"},{"word":"Premio","entry":"premio","definition":"1. Recompensa, galardón o remuneración que se da por algún mérito o servicio.\n2. Recompensa que se otorga en rifas, sorteos o concursos.","video":"https://panel.fundacioncnse-dilse.org/storage/premio.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/premio.png"},{"word":"Preocupación/Preocupar","entry":"preocupación","definition":"Acción y efecto de preocupar o preocuparse.","video":"https://panel.fundacioncnse-dilse.org/storage/preocupacion_1.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/preocupacion_1.png"},{"word":"Presidente/a","entry":"presidente, ta","definition":"Persona que preside un Gobierno, consejo, tribunal, junta, sociedad, acto, etc.","video":"https://panel.fundacioncnse-dilse.org/storage/presidente.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/presidente.png"},{"word":"Primavera","entry":"primavera","definition":"1. Estación del año que, astronómicamente, comienza en el equinoccio del mismo nombre y termina en el solsticio de verano.\n2. Época templada del año, que en el hemisferio boreal corresponde a los meses de marzo, abril y mayo, y en el austral a los de septiembre, octubre y noviembre.","video":"https://panel.fundacioncnse-dilse.org/storage/primavera.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/primavera.png"},{"word":"Primo/a","entry":"primo, ma","definition":"Hijo o hija del tío o de la tía de una persona.","video":"https://panel.fundacioncnse-dilse.org/storage/primo.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/primo.png"},{"word":"Princesa","entry":"princesa","definition":"1. Hija del rey o de la reina que es heredera de la corona.\n2. Consorte del príncipe.","video":"https://panel.fundacioncnse-dilse.org/storage/princesa.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/princesa.png"},{"word":"Principado de Asturias","entry":"Principado de Asturias","definition":"Comunidad autónoma que está localizada al noroeste de España, formada por una única provincia y cuya capital es Oviedo.","video":"https://panel.fundacioncnse-dilse.org/storage/principado-de-asturias.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/principado-asturias.png"},{"word":"Probar","entry":"probar","definition":"1. Hacer examen y experimento de las cualidades de alguien o algo.\n2. Hacer prueba, experimentar o intentar algo.","video":"https://panel.fundacioncnse-dilse.org/storage/probar_I.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/probar_I.png"},{"word":"Profesor/a","entry":"profesor, ra","definition":"Persona que ejerce o enseña una ciencia o arte.","video":"https://panel.fundacioncnse-dilse.org/storage/profesor.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/profesor.png"},{"word":"Programa","entry":"programa","definition":"1. Sistema y distribución de las materias de un curso o asignatura, que forman y publican los profesores encargados de explicarlas.\n2. Anuncio o exposición de las partes de que se han de componer ciertos actos o espectáculos o de las condiciones a que han de sujetarse, reparto, etc.\n3. Serie ordenada de operaciones necesarias para llevar a cabo un proyecto.\n4. Cada una de las distintas unidades temáticas que constituyen una emisión de radio o de televisión.\n5. Conjunto unitario de instrucciones que permite a una computadora realizar funciones diversas, como el tratamiento de textos, el diseño de gráficos, la resolución de problemas matemáticos, el manejo de bancos de datos, etc.","video":"https://panel.fundacioncnse-dilse.org/storage/programa.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/programa.png"},{"word":"Propina","entry":"propina","definition":"1. Agasajo que sobre el precio convenido y como muestra de satisfacción se da por algún servicio.\n2. Gratificación pequeña con que se recompensa un servicio eventual.","video":"https://panel.fundacioncnse-dilse.org/storage/propina.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/propina.png"},{"word":"Príncipe","entry":"príncipe, princesa","definition":"1. Hijo del rey o de la reina que es heredero de la corona.\n2. Consorte del príncipe o de la princesa.","video":"https://panel.fundacioncnse-dilse.org/storage/principe.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/principe.png"},{"word":"Próximo/a","entry":"próximo, ma","definition":"Cercano, que dista poco en el espacio.","video":"https://panel.fundacioncnse-dilse.org/storage/proximo-espacio.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/proximo-espacio.png"},{"word":"Pub","entry":"pub","definition":"Local público, de diseño cuidado, donde se sirven bebidas y se escucha música.","video":"https://panel.fundacioncnse-dilse.org/storage/pub.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pub.png"},{"word":"Publicidad","entry":"publicidad","definition":"1. Cualidad o estado de público.\n2. Conjunto de medios que se emplean para divulgar o extender la noticia de las cosas o de los hechos.\n3. Divulgación de noticias o anuncios de carácter comercial para atraer a posibles compradores, espectadores, usuarios, etc.","video":"https://panel.fundacioncnse-dilse.org/storage/publicidad.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/publicidad.png"},{"word":"Puerta","entry":"puerta","definition":"Armazón de madera, hierro u otra materia, que, engoznada o puesta en el quicio y asegurada por el otro lado con llave, cerrojo u otro instrumento, sirve para impedir la entrada y salida, para cerrar o abrir un armario o un mueble.","video":"https://panel.fundacioncnse-dilse.org/storage/puerta.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/puerta.png"},{"word":"Puerto","entry":"puerto","definition":"Lugar en la costa o en las orillas de un río que por sus características, naturales o artificiales, sirve para que las embarcaciones realicen operaciones de carga y descarga, embarque y desembarco,","video":"https://panel.fundacioncnse-dilse.org/storage/puerto.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/puerto.png"},{"word":"Pulsera (complemento)","entry":"pulsera","definition":"Cerco de metal o de otra materia que se lleva en la muñeca para adorno o para otros fines.","video":"https://panel.fundacioncnse-dilse.org/storage/pulsera.mov","photo":"https://panel.fundacioncnse-dilse.org/storage/pulsera.png"},{"word":"Punto (signo ortográfico)","entry":"punto","definition":"1. Rasgo gráfico sobrescrito en la i y la j minúsculas, y que forma parte de estas letras.\n2. Signo ortográfico (.) que señala el final de una oración, o que aparece detrás de una abreviatura.\n3. Signo igual al ortográfico que se emplea para separar la parte entera de la decimal en las expresiones numéricas.","video":"https://panel.fundacioncnse-dilse.org/storage/pun
